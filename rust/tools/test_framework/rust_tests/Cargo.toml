[package]
name = "robonix-stress-test"
version = "0.1.0"
edition = "2021"

[dependencies]
ros2-client = "0.8.2"
rustdds = "0.11.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
smol = "2.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
robonix-server = { path = "../../../robonix-core" }
