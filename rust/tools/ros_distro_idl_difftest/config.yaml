# ROS 2 distro IDL difftest – config for fetch_repos.sh and analyze_idl.py

# Distros to compare (branch names). Chronological: foxy (pre-Humble LTS), then humble, jazzy, rolling
distros:
  - foxy
  - humble
  - jazzy
  - rolling

# Optional: add iron, kilted, etc.
# distros_optional:
#   - iron
#   - kilted

# Repos to fetch and analyze (GitHub repo name used as clone target and directory name)
repos:
  - name: common_interfaces
    url: https://github.com/ros2/common_interfaces.git
    # Branch names match distros; if a branch is missing for a distro, that clone is skipped
  - name: rcl_interfaces
    url: https://github.com/ros2/rcl_interfaces.git
  - name: geometry2
    url: https://github.com/ros2/geometry2.git
    # tf2_msgs, tf2_geometry_msgs – transforms (very commonly used)
  - name: control_msgs
    url: https://github.com/ros-controls/control_msgs.git
    # Robot control messages/actions (joint/cartesian trajectories, controllers)
    # Only humble + jazzy; this repo has no foxy/rolling branches
    distros: [humble, jazzy]

# Root directory for clones (relative to this config’s directory, or absolute)
repos_dir: repos
