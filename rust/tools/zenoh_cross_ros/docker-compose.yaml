# Zenoh cross-ROS test: Humble + Jazzy; Zenoh peer-to-peer (Jazzy listens, Humble connects).
# Default Fast DDS (no CycloneDDS). Different ROS_DOMAIN_ID so DDS does not cross (only Zenoh bridges do).

services:
  humble:
    build:
      context: .
      dockerfile: docker/Dockerfile.humble
    environment:
      - ZENOH_CONNECT=tcp/jazzy:7447
      - ROS_DOMAIN_ID=0
    depends_on:
      - jazzy
    networks:
      - cross_ros

  jazzy:
    build:
      context: .
      dockerfile: docker/Dockerfile.jazzy
    environment:
      - ZENOH_LISTEN=tcp/0.0.0.0:7447
      - ROS_DOMAIN_ID=1
    networks:
      - cross_ros

networks:
  cross_ros:
    driver: bridge
