# robonix-codegen — ROS IDL codegen tool

[package]
name = "robonix-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "robonix-codegen: ROS IDL + contract TOML codegen — .msg/.srv → .proto; --contracts → robonix_contracts.proto"

[[bin]]
name = "robonix-codegen"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "1.1"
