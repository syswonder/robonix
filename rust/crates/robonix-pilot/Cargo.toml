[package]
name = "robonix-pilot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Robonix Pilot: VLM-driven reasoning, planning, and session management"

[[bin]]
name = "robonix-pilot"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
log.workspace = true
env_logger.workspace = true
uuid.workspace = true
robonix-sdk.workspace = true
robonix-interfaces.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
