[package]
name = "robonix-cli"
version = "0.1.0"
edition = "2024"
default-run = "rbnx"

[[bin]]
name = "rbnx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.33"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "6.0.0"
chrono = "0.4"
hostname = "0.4"
colored = "3.0.0"
git2 = "0.19"
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.1", features = ["signal", "process"] }

