[package]
name = "robonix-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ros2-client = {version = "0.8.2", features = ["pre-iron-gid"]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "chrono"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0.2"
tokio = { version = "1.0", features = ["full"] }
ansi_term = "0.12"
chrono = "0.4"
reqwest = { version = "0.12.24", features = ["json", "blocking"] }
