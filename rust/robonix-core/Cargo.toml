[package]
name = "robonix-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ros2-client = {version = "0.8.2", features = ["pre-iron-gid"]}
log = "0.4"
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "6.0"
anyhow = "1.0"
smol = "2.0.2"
tokio = { version = "1.49", features = ["full"] }
ansi_term = "0.12"
chrono = "0.4"
reqwest = { version = "0.13.1", features = ["json"] }
rocket = { version = "0.5", features = ["json"] }
tokio-stream = "0.1"
regex = "1.10"
image = "0.25"
byteorder = "1.5"
libc = "0.2"
base64 = "0.22"
