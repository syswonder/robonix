syntax = "proto3";
package robonix.atlas;

// ───────────────────────────────────────────────────────────────────────────
// Atlas — control-plane registry for Robonix capabilities.
//
// Vocabulary:
//   capability instance — one running unit (a process or set of processes)
//                         that registers with Atlas under a stable id.
//                         An instance offers one or more capability
//                         interfaces under a single namespace.
//   capability interface — a single contract-bound endpoint, addressed by
//                          its `contract_id` (e.g. "robonix/primitive/base/move").
//   transport — a wire protocol used to carry traffic for one interface.
//               The closed set lives in the `Transport` enum below; new
//               transports must be added there (no string escape hatch).
//               Each (capability_id, contract_id, transport) tuple is
//               unique: to expose the same interface over multiple
//               transports, call DeclareInterface once per transport.
//
// Two-step registration on purpose:
//   1) RegisterCapability — semantic announcement: "I am cap X, here are
//      the contract_ids I'll offer". Heartbeat starts ticking from here.
//   2) DeclareInterface (×N) — wire bind: "here's the actual transport
//      and endpoint for one of those contract_ids". Late-binds so a cap
//      can come up healthy before all transports are ready.
// ───────────────────────────────────────────────────────────────────────────


// Closed set of wire transports Atlas understands. Adding a transport is
// a deliberate proto bump — Atlas needs to know per-transport whether it
// can mint endpoint names (see DeclareInterfaceRequest), so a string
// escape hatch would silently route unknown transports through a wrong
// branch.
enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_GRPC = 1;
  TRANSPORT_ROS2 = 2;
  TRANSPORT_SHARED_MEMORY = 3; // TODO
  TRANSPORT_RAW_TCP = 4;       // TODO
  TRANSPORT_WEBSOCKET = 5;     // TODO
  // MCP — Robonix codegen turns a `contract.toml` into MCP Python types
  // and @mcp.tool wrappers; the serving package binds an HTTP MCP server
  // and registers its URL as `endpoint` (caller-supplied, not mintable).
  TRANSPORT_MCP = 6;
}

// One capability interface — a single contract_id offered by a capability
// instance. The full description for ALL interfaces of this instance lives
// in the package's single CAPABILITY.md (path on RegisterCapabilityRequest);
// this message carries only the per-interface identity + planner flags.
message CapabilityInterface {
  // Local leaf name. Convention: leaf of `contract_id` (snake_case).
  // e.g. "move", "odom", "rgb".
  string name = 1;
  // Stable full path, e.g. "robonix/primitive/base/move". MUST be a
  // contract id that exists in the system contract catalog (see
  // rust/contracts/).
  string contract_id = 2;
  // Planner / agent hints (typed flags). Add new fields here when a flag
  // becomes load-bearing for routing or prompt construction.
  bool disable_model_invocation = 3;  // hide from VLM tool list
  bool free_call = 4;                  // does NOT consume an env step
  // Package-author extension hatch for flags Atlas doesn't need to
  // understand. MUST parse as a JSON object (or be empty); Atlas
  // validates at register time and passes through to consumers.
  string extra_json = 5;
}

// Register a capability instance. Instance lives until either Unregister
// is called or heartbeats lapse past Atlas's eviction threshold.
//
// The same `capability_id` may NOT be registered twice — Atlas returns
// AlreadyExists. Re-registration must be preceded by Unregister.
message RegisterCapabilityRequest {
  // Reverse-DNS instance id, e.g. "com.robonix.primitive.base.ranger_mini".
  // Empty => Atlas assigns "com.robonix.ephemeral.<uuid>".
  string capability_id = 1;
  // Grouping namespace, e.g. "robonix/primitive/base". Every declared
  // contract_id MUST live under this prefix; otherwise Atlas rejects
  // the registration with InvalidArgument.
  string namespace = 2;
  // Absolute path to the package's single CAPABILITY.md. One markdown
  // per package describes all interfaces below; consumers read it via
  // QueryCapabilityMd. Empty path => no markdown for this instance.
  string capability_md_path = 3;
  // The set of capability interfaces this instance promises to offer.
  // Each entry's `contract_id` must be addressable via DeclareInterface
  // before consumers can connect.
  repeated CapabilityInterface interfaces = 4;
}
message RegisterCapabilityResponse {
  string capability_id = 1;
}

message UnregisterCapabilityRequest {
  string capability_id = 1;
}
// `was_present=true` means an existing record was removed; `false` means
// the id was unknown to Atlas (idempotent caller-side semantics).
message UnregisterCapabilityResponse {
  bool was_present = 1;
}

// Liveness signal. Atlas may evict instances whose heartbeat lapses.
// Failure cases (unknown capability_id, etc.) come back as gRPC Status,
// so the response carries no `ok` byte.
message HeartbeatRequest {
  string capability_id = 1;
}
message HeartbeatResponse {}

// ── Transport-specific declare params ──────────────────────────────────────
// One Params message per Transport enum variant. The wrapper
// `TransportParams.kind` MUST hold the variant matching the request's
// `transport` field; Atlas rejects mismatches with InvalidArgument.

// gRPC — `endpoint` already carries host:port. These three identify
// WHICH protobuf service+method that endpoint speaks; consumers need
// them to pick the right tonic-generated client. Request/response
// message types are derivable from method via proto_file, so they are
// NOT duplicated here.
message GrpcParams {
  string proto_file = 1;       // e.g. "robonix-interfaces/.../robonix_contracts.proto"
  string service_name = 2;     // e.g. "robonix.contracts.SrvCognitionReason"
  string method = 3;           // e.g. "/robonix.contracts.SrvCognitionReason/Stream"
}

// ROS2 — `endpoint` already carries the topic OR service name. The
// message type is implied by `contract_id` (contract catalog maps each
// contract 1:1 to its ROS msg type), so it is NOT duplicated here.
// `is_service` toggles topic-style pub/sub vs service-style req/resp,
// which use different ROS 2 APIs on the consumer side.
message Ros2Params {
  bool is_service = 1;
  // Optional QoS override; "" => ROS 2 default profile. Common values:
  // "sensor_data", "reliable", "system_default", "parameters".
  string qos_profile = 2;
}

// TODO
message SharedMemoryParams {
  uint64 size_bytes = 1;
  uint32 ringbuf_capacity = 2;
}

// TODO
message RawTcpParams {}

// TODO
message WebsocketParams {
  string subprotocol = 1;      // optional Sec-WebSocket-Protocol value
}

// One MCP tool declared at this interface's MCP server.
message McpToolDecl {
  string name = 1;
  string description = 2;
  // JSON Schema describing the tool's input. MUST parse as a JSON
  // object (or be empty for "no args"); MCP protocol fixes this format.
  string input_schema_json = 3;
}
message McpParams {
  // Tools served at this MCP endpoint. One DeclareInterface call may
  // bundle several tools that share the same endpoint URL.
  repeated McpToolDecl tools = 1;
}

// Discriminated transport params. The `kind` set MUST match the
// `Transport` value on the enclosing DeclareInterfaceRequest /
// InterfaceEndpoint.
message TransportParams {
  oneof kind {
    GrpcParams grpc = 1;
    Ros2Params ros2 = 2;
    SharedMemoryParams shared_memory = 3; // TODO
    RawTcpParams raw_tcp = 4; // TODO
    WebsocketParams websocket = 5; // TODO
    McpParams mcp = 6;
  }
}

// Bind ONE transport to ONE capability interface of an already-registered
// capability. To expose the same `contract_id` over multiple transports,
// call DeclareInterface once per transport.
//
// Caller supplies a *preferred* endpoint string in `endpoint`. Atlas
// guarantees the returned endpoint is globally unique on (transport,
// endpoint). Conflict-resolution rules (Atlas-side):
//   - empty proposal + atlas-mintable transport (ros2 / shared_memory)
//                       -> Atlas mints "/rbnx/<dotted-contract>/<uuid8>"
//   - empty proposal + non-mintable transport (grpc, mcp, raw_tcp, websocket)
//                       -> InvalidArgument (Atlas cannot allocate; caller
//                          must bind first and supply host:port / URL etc.)
//   - non-empty + no collision        -> stored verbatim
//   - non-empty + collision + mintable transport
//                       -> Atlas rewrites by appending "~<uuid8>"
//   - non-empty + collision + non-mintable transport
//                       -> AlreadyExists (caller must rebind / pick a new
//                          name and retry)
//
// CALLER MUST USE the returned endpoint (it may differ from what was
// proposed when Atlas rewrote to disambiguate).
message DeclareInterfaceRequest {
  string capability_id = 1;
  // Must match a contract_id announced in RegisterCapability.
  string contract_id = 2;
  Transport transport = 3;
  // Preferred address string. Format is transport-specific:
  //   grpc:          "127.0.0.1:50105"   (caller binds first)
  //   ros2:          "/scanner/cloud"     ("" => Atlas mints)
  //   shared_memory: "/rbnx_shm_lidar"    ("" => Atlas mints)
  //   raw_tcp:       "host:port"
  //   websocket:     "ws://host:port/path"
  //   mcp:           "http://host:port/mcp"
  string endpoint = 4;
  // Transport-specific params; the oneof variant MUST match `transport`.
  TransportParams params = 5;
}
message DeclareInterfaceResponse {
  // Authoritative endpoint actually registered. Equal to request.endpoint
  // when there was no collision; otherwise an Atlas-rewritten unique form.
  string endpoint = 1;
}

// One declared (transport, endpoint) binding for one capability interface.
message InterfaceEndpoint {
  string contract_id = 1;
  Transport transport = 2;
  string endpoint = 3;
  TransportParams params = 4;
}

// Read view of a registered capability instance.
message CapabilityRecord {
  string capability_id = 1;
  string namespace = 2;
  uint64 last_heartbeat_ms = 3;
  repeated CapabilityInterface interfaces = 4;
  repeated InterfaceEndpoint endpoints = 5;
}

// Discover capability instances. Filters AND together when set.
message QueryCapabilitiesRequest {
  // Exact match on a CapabilityInterface contract_id offered by the instance.
  string contract_id = 1;
  // Prefix match on the instance's `namespace`.
  string namespace = 2;
  // Exact match on InterfaceEndpoint.transport (filter is on endpoints,
  // not on the instance itself). TRANSPORT_UNSPECIFIED = no filter.
  Transport transport = 3;
}
message QueryCapabilitiesResponse {
  repeated CapabilityRecord records = 1;
}

// Get the package's CAPABILITY.md content for an instance. One markdown
// per package — describes all interfaces in a single document.
message QueryCapabilityMdRequest {
  string capability_id = 1;
}
message QueryCapabilityMdResponse {
  // Empty when the instance was registered with no `capability_md_path`.
  string capability_md = 1;
}

// Inspect Atlas state. Debug-only, returns implementation-defined JSON.
message InspectAtlasRequest {}
message InspectAtlasResponse {
  string json = 1;
}

service Atlas {
  rpc RegisterCapability(RegisterCapabilityRequest)
      returns (RegisterCapabilityResponse);
  rpc UnregisterCapability(UnregisterCapabilityRequest)
      returns (UnregisterCapabilityResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc DeclareInterface(DeclareInterfaceRequest)
      returns (DeclareInterfaceResponse);
  rpc QueryCapabilities(QueryCapabilitiesRequest)
      returns (QueryCapabilitiesResponse);
  rpc QueryCapabilityMd(QueryCapabilityMdRequest)
      returns (QueryCapabilityMdResponse);
  rpc InspectAtlas(InspectAtlasRequest) returns (InspectAtlasResponse);
}
