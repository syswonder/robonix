# Send a navigation goal to the robot base.
# ROS IDL: `lib/prm_base/srv/Navigate.srv` (geometry_msgs/PoseStamped goal → accepted + status_message).
[contract]
id      = "robonix/service/navigation/navigate"
version = "1"
kind    = "service"


[io.srv]
srv = "prm_base/srv/Navigate"

[mode]
type = "rpc"

