# Stream demo: output stream (pose) + input stream (alerts) via robonix-server
manifestVersion: 1

package:
  id: com.robonix.example.stream_demo
  name: stream_demo
  version: 0.1.0
  vendor: robonix
  description: Stream demo - pose publisher/subscriber + alerts input server/client
  license: MulanPSL-2.0

nodes:
  - id: stream_server
    type: python
    entry: stream_demo.stream_server:main
  - id: stream_client
    type: python
    entry: stream_demo.stream_client:main
  - id: input_demo_server
    type: python
    entry: stream_demo.input_server:main
  - id: input_demo_client
    type: python
    entry: stream_demo.input_client:main
