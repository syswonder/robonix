[project]
name = "robonix-maniskill-grasp-demo"
version = "0.3.0"
description = "ManiSkill3 grasp demo: env + perception + Open3D/SAM2 manipulation nodes for robonix-pilot"
requires-python = ">=3.11,<3.12"

dependencies = [
    # ── Robonix inter-node communication ──────────────────────────────────────
    "iceoryx2>=0.8.1",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "mcp[cli]>=1.0",
    "uvicorn>=0.27",
    "Pillow>=10.0",
    "openai>=1.0",
    # ── Teleop keyboard input ─────────────────────────────────────────────────
    "pynput>=1.7",
    # ── Visualization ─────────────────────────────────────────────────────────
    "rerun-sdk>=0.22",
    # ── Simulation (ManiSkill3) ───────────────────────────────────────────────
    "mani-skill",
    # ── Perception: YOLO-World (default) + optional GroundingDINO ────────────
    "ultralytics>=8.3.0",
    "transformers>=4.34,<5.0",
    # ── PyTorch with CUDA ─────────────────────────────────────────────────────
    # 2.7+ required for RTX 5090 / Blackwell (sm_120).
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    # ── VLA (OpenVLA) ─────────────────────────────────────────────────────────
    "accelerate>=0.33",
    "bitsandbytes>=0.45",
    "huggingface-hub>=0.25",
    "tokenizers>=0.20",
    # OpenVLA requires 0.9.10 <= timm < 1.0 (hard assertion).
    "timm>=0.9.10,<1.0",
    # ── Numerics (numpy 1.x kept for ManiSkill3 / SciPy ABI compatibility) ───
    "numpy>=1.26.4,<2",
    # ── Rotation math (used by grasp_node for grasp pose transforms) ──────────
    "scipy>=1.6.0",
    # ── Geometric grasp prediction ────────────────────────────────────────────
    "open3d>=0.17",
    # ── SAM2 segmentation (Meta, 2024) ────────────────────────────────────────
    "sam2>=1.0",
    "scikit-learn>=1.0",
]

[tool.setuptools.packages.find]
include = ["maniskill_vla_demo*"]

[project.optional-dependencies]
# [ARCHIVED] GraspNet-1Billion backend — replaced by Open3D + SAM2 (no compilation needed).
# Kept for reference; graspnet-baseline submodule is still present.
graspnet = [
    "graspnetAPI @ git+https://github.com/graspnet/graspnetAPI",
]

# Agent memory MCP (same stack as rust/examples/packages/memsearch_service).
# Install: uv sync --extra memsearch
memsearch = [
    "memsearch[onnx]>=0.2",
    "fastmcp>=3",
]

# ── uv configuration ──────────────────────────────────────────────────────────

[tool.uv]
# Keep NumPy 1.x (ManiSkill3 / SciPy ABI requirement).
override-dependencies = [
    "numpy<2",
]

[tool.uv.sources]
# PyTorch CUDA wheels from the official wheel server
torch       = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true
