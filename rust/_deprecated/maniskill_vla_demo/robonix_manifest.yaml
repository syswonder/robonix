# ManiSkill3 + VLA demo.
# Phase 1: env_node hosts ManiSkill3 simulator; vla_node drives env with
# OpenVLA 7B via MCP tool calls. Perception + geometric grasp nodes are
# disabled for this phase (VLA uses raw RGB, no detection/segmentation
# pipeline needed).
manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.maniskill_vla_demo
  name: maniskill_vla_demo
  version: 0.3.0
  vendor: robonix
  description: ManiSkill3 + VLA demo — env + VLA policy node for robonix-pilot
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.demo.maniskill
    type: python
    start: exec env CUDA_VISIBLE_DEVICES=2,3 PATH=/home/hanyulong/.local/bin:/snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin uv run python3 -m maniskill_vla_demo.env_node

  - id: com.robonix.demo.vla
    type: python
    # VLA_BACKEND=openvla (default) | scripted
    # VLA_MODEL: local dir of RLinf-OpenVLA-PPO-ManiSkill3-25ood (fine-tuned on ManiSkill3)
    # VLA_UNNORM_KEY=warmup matches the RLinf checkpoint's norm_stats key
    start: exec env CUDA_VISIBLE_DEVICES=2,3 HF_ENDPOINT=https://hf-mirror.com VLA_MODEL=/home/hanyulong/models/openvla-rlinf-ms3 VLA_UNNORM_KEY=warmup PATH=/home/hanyulong/.local/bin:/snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin uv run python3 -m maniskill_vla_demo.vla_node

  # [DISABLED for phase 1] perception / geometric grasp / viz / mapping.
  # See Phase 2 for re-enabling perception + geometric grasp alongside VLA.
  # - id: com.robonix.demo.perception
  #   type: python
  #   start: ...
  # - id: com.robonix.demo.grasp
  #   type: python
  #   start: ...
  # - id: com.robonix.demo.viz
  #   type: python
  #   start: ...
  # - id: com.robonix.demo.mapping
  #   type: docker
  #   start: exec bash docker/run_rtabmap.sh
