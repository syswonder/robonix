syntax = "proto3";
package maniskill;

service EnvDataService {
  rpc GetObs(Empty) returns (Observation);
  rpc Step(Action) returns (StepResult);
  rpc Reset(Empty) returns (Observation);
}

// SLAM results served by rtabmap_bridge running in the Docker container.
// viz_node (on the host) polls this to log 3-D cloud + 2-D occupancy to Rerun.
service SlamDataService {
  rpc GetSlamData(Empty) returns (SlamData);
}

message Empty {}

message Observation {
  bytes rgb = 1;              // HWC uint8 raw bytes
  bytes depth = 2;            // HW float32 raw bytes
  int32 width = 3;
  int32 height = 4;
  repeated float proprio = 5; // joint positions, velocities, ee pose
  bool done = 6;
  float reward = 7;
  float fx = 8;               // camera intrinsics
  float fy = 9;
  float cx = 10;
  float cy = 11;
  repeated float goal_pos = 12; // target object position [x,y,z]
  repeated float camera_pose = 13; // 4x4 row-major T_world_camera (camera-to-world transform)
  repeated float tcp_pose = 14;    // [x,y,z,qx,qy,qz,qw] end-effector pose in world frame
}

message Action {
  // Fetch action layout (12-DoF):
  // [0:6]   arm ee delta pose: dx,dy,dz,drx,dry,drz
  // [6]     gripper (open/close)
  // [7:10]  body joints (torso, head_pan, head_tilt)
  // [10:12] mobile base (linear, angular)
  // Shorter arrays are zero-padded by env_node.
  repeated float values = 1;
}

message StepResult {
  Observation obs = 1;
  float reward = 2;
  bool done = 3;
  string info_json = 4;
}

// ── SLAM data messages ───────────────────────────────────────────────────────

message SlamCloudMap {
  // Accumulated 3-D map from RTAB-Map (/rtabmap/cloud_map).
  bytes xyz      = 1;  // (n_points × 3) float32 bytes, world-frame XYZ
  bytes rgb      = 2;  // (n_points × 3) uint8  bytes, RGB colours (may be empty)
  uint32 n_points = 3;
}

message SlamOccupancyMap {
  // 2-D occupancy grid from RTAB-Map (/rtabmap/grid_map), already converted
  // to a grayscale uint8 image: 255=free, 0=occupied, 128=unknown.
  // Origin is top-left (already vertically flipped from ROS convention).
  bytes  image      = 1;  // width × height uint8 bytes
  uint32 width      = 2;
  uint32 height     = 3;
  float  resolution = 4;  // metres per cell
  float  origin_x   = 5;  // world-frame origin (bottom-left corner before flip)
  float  origin_y   = 6;
}

message SlamData {
  SlamCloudMap      cloud_map      = 1;
  SlamOccupancyMap  occupancy_map  = 2;
}
