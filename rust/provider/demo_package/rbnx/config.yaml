# Robonix package configuration
# This file contains package-specific configuration

package:
  name: demo_rgb_provider
  version: 0.0.1

# Logging configuration
logging:
  level: INFO
  file: /tmp/demo_package.log

# Resource limits (optional)
resources:
  max_memory_mb: 512
  max_cpu_percent: 50

# Environment variables (optional)
environment:
  DEMO_MODE: "true"
  DEMO_DEBUG: "false"

