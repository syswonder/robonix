[workspace]
members = ["crates/*"]
# robonix-py is a Python-only library (no Cargo.toml) — exclude from the Rust workspace.
# pilot/executor/cli/liaison still reference the deleted robonix-sdk; temporarily
# excluded until the migration to atlas.proto stubs lands (see task #31).
exclude = [
    "crates/robonix-py",
    "crates/robonix-cli",
    
    "crates/robonix-liaison",
    "crates/robonix-interfaces",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.18"

# Logging
log = "0.4"
env_logger = "0.11"

# gRPC
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"

# gRPC build
tonic-build = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"

# UUID
uuid = { version = "1", features = ["v4"] }

# OpenAI-compatible VLM client
async-openai = "0.34.0"

# MCP (Model Context Protocol)
rmcp = { version = "1.3.0", features = ["server", "client"] }

# HTTP client
reqwest = { version = "0.13.2", features = ["json"] }

# Image encoding
image = "0.25"

# TUI
ratatui = "0.30.0"
crossterm = "0.29.0"

# Internal crates
robonix-codegen = { path = "crates/robonix-codegen" }