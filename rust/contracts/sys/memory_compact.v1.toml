# Compact and summarise recent memory entries.
# Input: empty (no parameters needed).
# Output: status / summary path (std_msgs/String.data).
[contract]
id      = "robonix/sys/memory/compact"
version = "1"
kind    = "service"

[io]
input  = "std_msgs/msg/Empty"
output = "std_msgs/msg/String"

[mode]
type = "rpc"

[semantics]
persistent = true
