# Unary query/response as text. ROS IDL: `lib/memory/srv/Search.srv`.
# MCP providers may still expose tools; this contract is the aligned gRPC / ROS `.srv` path.
[contract]
id      = "robonix/sys/memory/search"
version = "1"
kind    = "service"


[io.srv]
srv = "memory/srv/Search"

[mode]
type = "rpc"

[semantics]
persistent = true
searchable = true
