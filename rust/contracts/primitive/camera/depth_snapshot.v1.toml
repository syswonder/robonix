# On-demand depth image snapshot (single frame).
# Complements robonix/prm/camera/depth (continuous stream).
# ROS IDL: `lib/prm_base/srv/GetCameraImage.srv` (same wire as RGB snapshot; encoding differs).
[contract]
id      = "robonix/primitive/camera/depth_snapshot"
version = "1"
kind    = "primitive"


[io.srv]
srv = "prm_base/srv/GetCameraImage"

[mode]
type = "rpc"

[semantics]
payload = "depth_image"
