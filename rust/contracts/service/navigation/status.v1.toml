# Query the status of a previously issued navigation goal.
# ROS IDL: `lib/prm_base/srv/GetNavigationStatus.srv` (goal_id → known + status + terminal).
[contract]
id      = "robonix/service/navigation/status"
version = "1"
kind    = "service"


[io.srv]
srv = "prm_base/srv/GetNavigationStatus"

[mode]
type = "rpc"
