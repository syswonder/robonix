# Unified user-facing entry point. Two RPCs share this contract:
#   * Stream(Task) → stream PilotEvent             — text / API / pre-built Task path
#   * StartVoiceSession(...) → stream VoiceEvent   — voice push-to-talk path
# Voice path is orchestrated end-to-end inside Liaison (mic → ASR → voiceprint
# → Pilot → optional TTS → speaker); clients only render VoiceEvents.
# ROS: `lib/liaison/srv/SubmitTask.srv`, `lib/liaison/srv/StartVoiceSession.srv`.
[contract]
id      = "robonix/srv/liaison"
version = "1"
kind    = "service"

[io.srv]
srv = "liaison/srv/SubmitTask"

[mode]
type = "rpc_server_stream"

[semantics]
unified_entry = true
interruptible = true
multimodal    = true
