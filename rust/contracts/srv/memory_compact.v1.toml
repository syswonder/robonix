# Compact and summarise recent memory entries.
# ROS IDL: `lib/memory/srv/Compact.srv` — unary RPC, empty request, `std_msgs/String` summary.
[contract]
id      = "robonix/srv/memory/compact"
version = "1"
kind    = "service"


[io.srv]
srv = "memory/srv/Compact"

[mode]
type = "rpc"

[semantics]
persistent = true
