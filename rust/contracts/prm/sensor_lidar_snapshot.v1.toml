# On-demand lidar scan snapshot (single scan).
# Complements robonix/prm/sensor/lidar (continuous stream).
# ROS IDL: `lib/prm_base/srv/GetLaserScan.srv`.
[contract]
id      = "robonix/prm/sensor/lidar_snapshot"
version = "1"
kind    = "primitive"

[io.srv]
srv = "prm_base/srv/GetLaserScan"

[mode]
type = "rpc"
