# Speaker audio stream input (raw PCM or encoded).
# ROS: `robonix_msg/msg/AudioChunk` consumed from a topic.
[contract]
id      = "robonix/prm/audio/speaker"
version = "1"
kind    = "primitive"

[io.msg]
msg = "robonix_msg/msg/AudioChunk"

[mode]
type = "topic_in"

[semantics]
realtime = true
payload  = "audio"
