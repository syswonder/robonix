# On-demand depth image snapshot (single frame).
# Complements robonix/prm/camera/depth (continuous stream) — use this for
# one-shot depth queries (MCP tools, obstacle detection, debug capture).
# Input:  empty trigger.
# Output: one sensor_msgs/Image frame (depth encoding, e.g. 16UC1).
[contract]
id      = "robonix/prm/camera/depth_snapshot"
version = "1"
kind    = "primitive"

[io]
input  = "std_msgs/msg/Empty"
output = "sensor_msgs/msg/Image"

[mode]
type = "rpc"

[semantics]
payload = "depth_image"
