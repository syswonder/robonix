# Single-frame image acquisition (on-demand snapshot).
# Complements robonix/prm/camera/rgb (continuous stream) — use this for
# one-shot vision queries (MCP tools, VLM input, debug capture).
# Input:  empty trigger.
# Output: one sensor_msgs/Image frame (encoding, width, height, data as in stream).
[contract]
id      = "robonix/prm/camera/snapshot"
version = "1"
kind    = "primitive"

[io]
input  = "std_msgs/msg/Empty"
output = "sensor_msgs/msg/Image"

[mode]
type = "rpc"

[semantics]
payload = "image"
