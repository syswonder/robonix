# Matches README: robonix/prm/base/odom → nav_msgs/Odometry publisher.
[contract]
id      = "robonix/prm/base/odom"
version = "1"
kind    = "primitive"

[io]
input  = "std_msgs/msg/Empty"
output = "nav_msgs/msg/Odometry"

[mode]
type = "stream_out"

[semantics]
realtime = true

# Publication rate is provider-specific (DeclareInterface metadata), not fixed here.
