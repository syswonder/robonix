# 3D LiDAR point cloud stream (PointCloud2).
# Distinct from sensor/lidar (2D LaserScan).
# Used by 3D SLAM engines (e.g. FASTLIO2) that require full 3D point cloud input.
[contract]
id      = "robonix/prm/sensor/lidar3d"
version = "1"
kind    = "primitive"

[io.msg]
msg = "sensor_msgs/msg/PointCloud2"

[mode]
type = "topic_out"

[semantics]
realtime = true
