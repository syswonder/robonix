# Cancel an active navigation goal.
# Input:  std_msgs/String.data — JSON: {"goal_id": str}
# Output: std_msgs/String.data — JSON: {"goal_id": str, "accepted": bool, "message": str}
[contract]
id      = "robonix/prm/base/nav_cancel"
version = "1"
kind    = "primitive"

[io]
input  = "std_msgs/msg/String"
output = "std_msgs/msg/String"

[mode]
type = "rpc"
