# Query the status of a previously issued navigation goal.
# Input:  std_msgs/String.data — JSON: {"goal_id": str}
# Output: std_msgs/String.data — JSON: {"goal_id": str, "known": bool, "status": str, "terminal": bool}
[contract]
id      = "robonix/prm/base/nav_status"
version = "1"
kind    = "primitive"

[io]
input  = "std_msgs/msg/String"
output = "std_msgs/msg/String"

[mode]
type = "rpc"
