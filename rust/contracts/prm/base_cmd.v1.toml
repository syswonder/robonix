# Single MoveCommand execution (RPC variant of robonix/prm/base/move stream-in).
# ROS IDL: `lib/prm_base/srv/ExecuteMoveCommand.srv`.
[contract]
id      = "robonix/prm/base/cmd"
version = "1"
kind    = "primitive"


[io.srv]
srv = "prm_base/srv/ExecuteMoveCommand"

[mode]
type = "rpc"

[semantics]
preemptable = true
