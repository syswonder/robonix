# Stream demo: one output server (publisher), one client (subscriber) connecting via robonix-server
manifestVersion: 1

package:
  id: com.robonix.example.stream_demo
  name: stream_demo
  version: 0.1.0
  vendor: robonix
  description: Stream demo - pose publisher and subscriber via robonix-server
  license: MulanPSL-2.0

nodes:
  - id: stream_server
    type: python
    entry: stream_demo.stream_server:main
  - id: stream_client
    type: python
    entry: stream_demo.stream_client:main
