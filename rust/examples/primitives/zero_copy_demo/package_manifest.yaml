manifestVersion: 1

build: bash scripts/build.sh

# Main node: camera (SHM producer)
start: exec python3 -m zero_copy_demo.nodes.camera_node

# Other nodes (to be split into separate packages later):
#   yolo:  exec python3 -m zero_copy_demo.nodes.yolo_node
#   edge:  exec python3 -m zero_copy_demo.nodes.edge_node

package:
  name: com.robonix.example.zero_copy_demo
  version: 0.2.0
  vendor: robonix
  description: >-
    Multi-process zero-copy buffer PoC: Camera -> SHM -> YOLO (GPU) -> Sobel (CUDA IPC).
  license: MulanPSL-2.0

capabilities:
  - name: robonix/prm/camera/rgb

depends: []
