// ──────────────────────────────────────────────────────────────────────────
// Audio Driver — gRPC service definitions for mic capture & speaker playback
//
// Architecture position: robonix/prm/audio (primitive / hardware layer)
//   - Auto-scans ALSA devices (arecord -l / aplay -l)
//   - Captures raw PCM from microphone → streams AudioChunk upward
//   - Receives AudioChunk from upper-layer services → plays via speaker
//   - Registers with Atlas as primitive node under robonix/prm/audio
//
// This package serves as a REFERENCE TEMPLATE for all future prm driver
// packages. Key patterns to replicate:
//   1. Self-contained proto (inlined types, no cross-package imports)
//   2. ALSA auto-detection via subprocess (arecord/aplay)
//   3. Driver registry for hardware extensibility (AudioDeviceDriver ABC)
//   4. Atlas registration + heartbeat (tiago_bridge pattern)
//   5. Daemon threads for gRPC servers (one per interface)
//
// Build: scripts/build.sh generates *_pb2.py / *_pb2_grpc.py into proto_gen/
// ──────────────────────────────────────────────────────────────────────────

syntax = "proto3";
package robonix.audio_driver;

// ── Shared types ─────────────────────────────────────────────────────────
// Inlined for standalone build. Decoupled from speech_service.proto types.

// Describes the audio format used by a stream.
message AudioConfig {
  string encoding = 1;        // PCM encoding name, e.g. "pcm_s16le", "pcm_s24le"
  uint32 sample_rate_hz = 2;  // sample rate in Hz (mic default: 16000, speaker default: 24000)
  uint32 channels = 3;        // 1 = mono, 2 = stereo
  uint32 bits_per_sample = 4; // bits per sample (8, 16, 24, 32)
}

// A single time-stamped audio chunk. Produced by mic capture, consumed by
// speaker playback. Sequence numbers are monotonic per stream for ordering.
message AudioChunk {
  uint64 timestamp_ns = 1;  // capture/playback timestamp in nanoseconds since epoch
  bytes data = 2;           // raw PCM bytes (no headers, no container)
  uint32 sequence = 3;      // monotonically increasing chunk counter
  float duration_s = 4;     // duration of this chunk in seconds (e.g. 0.1)
}

// ── Mic interface (topic_out: driver produces, consumers subscribe) ──────
//
// Data flow: ALSA mic → arecord subprocess → MicDriver → gRPC stream → caller
//
// The mic driver captures at a fixed format (default 16kHz mono s16le).
// If audio_config is provided, it is logged but currently the driver captures
// at its configured rate (see environment overrides in node.py).

message MicStreamRequest {
  AudioConfig audio_config = 1; // optional: desired capture format. If empty, uses defaults.
}

// ── Speaker interface (topic_in: consumers push, driver plays) ──────────
//
// Data flow: caller → gRPC client stream → SpeakerDriver → aplay subprocess → ALSA speaker
//
// The first message SHOULD include audio_config to set the playback format.
// Subsequent messages carry chunk.data for continuous playback.

message SpeakerChunkRequest {
  AudioChunk chunk = 1;         // audio data to play
  AudioConfig audio_config = 2; // optional: sent once in first message to configure playback
}

message SpeakerStreamResponse {
  bool ok = 1;       // true if all chunks played successfully
  string error = 2;  // non-empty on failure
}

// ── Services ────────────────────────────────────────────────────────────
// Two separate services for mic and speaker, each registered with Atlas
// as a distinct interface under the robonix/prm/audio namespace.

// Microphone capture service.
// Contract ID: robonix/prm/audio/mic
// Transport: gRPC server-streaming
// Mode: caller sends one request, server streams AudioChunk continuously
//       until the caller disconnects or the mic stops.
service PrmAudioMic {
  rpc Stream(MicStreamRequest) returns (stream AudioChunk);
}

// Speaker playback service.
// Contract ID: robonix/prm/audio/speaker
// Transport: gRPC client-streaming
// Mode: caller streams audio chunks, driver plays them in real time.
//       Returns a single response when the caller closes the stream.
service PrmAudioSpeaker {
  rpc Stream(stream SpeakerChunkRequest) returns (SpeakerStreamResponse);
}
