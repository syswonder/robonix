# Robonix Speech Service — ASR (Whisper) + TTS (Edge TTS) + Dialog Manager.
# Data plane: gRPC servicers for speech/asr, speech/tts, speech/asr_stream,
# speech/tts_stream, speech/dialog contracts.
# Host build: scripts/build.sh runs rbnx codegen for proto stubs.
manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.speech_service
  name: speech_service
  version: 0.1.0
  vendor: robonix
  description: Voice interaction service (ASR + TTS + Dialog) registered under robonix/srv/speech
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.services.speech
    type: python
    start: |
      export PYTHONPATH="$(pwd)/proto_gen:${PYTHONPATH:-}"
      exec python -m speech_service.service
