[project]
name = "robonix-mcp-contract"
version = "0.1.0"
description = "Contract-enforced FastMCP tools aligned with robonix-codegen --lang mcp ROS dataclasses"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "fastmcp>=3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["robonix_mcp_contract*"]
