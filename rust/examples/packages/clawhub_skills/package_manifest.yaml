# Bridge package — pulls selected skills from OpenClaw's community repo
# (openclaw/skills) and registers them with atlas so Pilot can discover
# them. Demonstrates native compatibility with the Agent Skills standard
# (agentskills.io): SKILL.md files work without format conversion.
manifestVersion: 1

package:
  name: com.robonix.example.clawhub_skills
  version: 0.1.0
  vendor: robonix
  description: Imports community skills from OpenClaw ClawHub into Robonix.
  license: MulanPSL-2.0

build: bash scripts/build.sh

start: |
  export PYTHONPATH="$(pwd)/src:${PYTHONPATH:-}"
  exec python -m clawhub_bridge
