# Tiago sim stack — stack-specific build/start via scripts + manifest `start`.
manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.tiago_sim_stack
  name: tiago_sim_stack
  version: 0.1.0
  vendor: robonix
  description: Tiago sim stack — Docker image runs Webots (GUI), Nav2, and tiago_bridge (MCP → robonix-atlas)
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.prm.tiago
    type: compose
    start: |
      CF=(-f compose.yaml)
      if command -v nvidia-smi &>/dev/null && nvidia-smi &>/dev/null; then
        CF+=(-f compose.gpu.yaml)
        echo "[tiago_sim_stack] NVIDIA GPU detected — merging compose.gpu.yaml"
      fi
      exec docker compose "${CF[@]}" up --build ros2-bridge
