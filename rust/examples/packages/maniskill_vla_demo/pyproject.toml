[project]
name = "robonix-maniskill-vla-demo"
version = "0.1.0"
description = "ManiSkill3 VLA demo: env + perception + VLA nodes for robonix-agent"
requires-python = ">=3.11,<3.12"

dependencies = [
    # ── Robonix inter-node communication ──────────────────────────────────────
    "iceoryx2>=0.8.1",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "mcp[cli]>=1.0",
    "uvicorn>=0.27",
    "Pillow>=10.0",
    "openai>=1.0",
    # ── Teleop keyboard input ─────────────────────────────────────────────────
    "pynput>=1.7",
    # ── Visualization ─────────────────────────────────────────────────────────
    "rerun-sdk>=0.22",
    # ── Simulation (ManiSkill3) ───────────────────────────────────────────────
    "mani-skill",
    # ── Perception: YOLO-World (ultralytics, default) + optional GroundingDINO (transformers)
    "ultralytics>=8.3.0",
    "transformers>=4.34,<5.0",  # FlaxAutoModel (used by Octo) removed in transformers 5.0
    # ── PyTorch with CUDA (ManiSkill3 + GroundingDINO) ───────────────────────
    # Wheels sourced from pytorch-cu124 index (see [tool.uv.sources] below)
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    # ── Octo exact dependency stack (JAX 0.4.20 ecosystem) ───────────────────
    # Source: https://github.com/octo-models/octo/blob/main/requirements.txt
    # Python 3.11 required: tensorflow==2.15.0 has no py3.12 wheel.
    "numpy==1.24.3",
    # torch 2.6+cu124 requires nvidia-cudnn-cu12==9.1, but jaxlib 0.4.20+cudnn89 needs 8.9.
    # These are mutually exclusive. Use CPU jaxlib so ManiSkill3/GroundingDINO keep GPU
    # while Octo inference runs on CPU (~2 s/step for octo-small — fine for demos).
    "jax==0.4.20",
    "jaxlib==0.4.20",
    "flax==0.7.5",
    "optax==0.1.5",
    "tensorflow==2.15.0",
    "tensorflow-probability==0.23.0",
    "tensorflow-datasets==4.9.2",
    "distrax==0.1.5",
    "chex==0.1.85",
    "ml-dtypes==0.2.0",
    "ml-collections>=0.1.0",
    "einops>=0.6.1",
    "absl-py>=0.12.0",
    "scipy>=1.6.0,<1.13",  # scipy.linalg.tril removed in 1.13; required by JAX 0.4.20
    "imageio>=2.31.1",
    # ── Octo model + its non-PyPI data-loading helper ────────────────────────
    "octo",
    "dlimp",
]

[tool.setuptools.packages.find]
include = ["maniskill_vla_demo*"]

# ── uv configuration ──────────────────────────────────────────────────────────

[tool.uv]

[tool.uv.sources]
# Packages not on PyPI — installed directly from git
octo    = { git = "https://github.com/octo-models/octo" }
dlimp   = { git = "https://github.com/kvablack/dlimp",
            rev = "5edaa4691567873d495633f2708982b42edf1972" }
# PyTorch CUDA wheels from the official wheel server
torch       = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name     = "pytorch-cu124"
url      = "https://download.pytorch.org/whl/cu124"
explicit = true
