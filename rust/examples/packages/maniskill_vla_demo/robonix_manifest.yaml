# Env/perception/GraspNet nodes: MCP tools + demo-local gRPC (maniskill_env.proto).
# Robonix contract gRPC lives in robonix_contracts.proto only.
manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.maniskill_graspnet_demo
  name: maniskill_graspnet_demo
  version: 0.2.0
  vendor: robonix
  description: ManiSkill3 GraspNet demo — env, perception, GraspNet manipulation nodes for robonix-pilot
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.demo.maniskill
    type: python
    start: exec uv run python3 -m maniskill_vla_demo.env_node

  - id: com.robonix.demo.perception
    type: python
    start: exec uv run python3 -m maniskill_vla_demo.perception_node

  - id: com.robonix.demo.grasp
    type: python
    # GRASP_BACKEND=open3d (default, SAM2+Open3D geometric) or heuristic
    start: exec uv run python3 -m maniskill_vla_demo.grasp_node

  - id: com.robonix.demo.viz
    type: python
    start: exec uv run python3 -m maniskill_vla_demo.viz_node ${VIZ_DETECT:+--detect} ${VIZ_QUERY:+--query "${VIZ_QUERY}"} --fps "${VIZ_FPS:-10}"

  - id: com.robonix.demo.mapping
    type: docker
    start: exec bash docker/run_rtabmap.sh

  # [ARCHIVED] vla_node now runs scripted policy only; Octo is shelved.
  # - id: com.robonix.demo.vla
  #   type: python
  #   start: exec python3 -m maniskill_vla_demo.vla_node --policy scripted
