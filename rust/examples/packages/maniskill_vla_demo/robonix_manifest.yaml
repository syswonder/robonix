manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.maniskill_vla_demo
  name: maniskill_vla_demo
  version: 0.1.0
  vendor: robonix
  description: ManiSkill3 VLA demo — env, perception, VLA nodes for robonix-pilot ReAct loop
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.demo.maniskill
    type: python
    start: exec python3 -m maniskill_vla_demo.env_node

  - id: com.robonix.demo.perception
    type: python
    start: exec python3 -m maniskill_vla_demo.perception_node

  - id: com.robonix.demo.vla
    type: python
    start: exec python3 -m maniskill_vla_demo.vla_node --policy "${VLA_POLICY:-scripted}"

  - id: com.robonix.demo.viz
    type: python
    start: exec python3 -m maniskill_vla_demo.viz_node ${VIZ_DETECT:+--detect} ${VIZ_QUERY:+--query "${VIZ_QUERY}"} --fps "${VIZ_FPS:-10}"

  - id: com.robonix.demo.mapping
    type: docker
    start: exec bash docker/run_rtabmap.sh
