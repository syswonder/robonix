# Robonix voiceprint service — ECAPA-TDNN one-shot speaker identification.
# Provides the frozen v0.1 capability `robonix/system/speech/voiceprint`
# (Identify only) plus package-private admin RPCs (Enroll, ListEnrolled)
# for off-line enrollment tooling.
#
# Runtime config consumed via environment:
#   VOICEPRINT_PORT        — gRPC listen port (default 50092)
#   VOICEPRINT_BIND_ADDR   — gRPC bind address (default 0.0.0.0)
#   VOICEPRINT_DATA_DIR    — where enrolled.json lives
#   VOICEPRINT_THRESHOLD   — cosine-similarity gate (default 0.25)
#   VOICEPRINT_DEVICE      — cuda:0 | cpu (auto-detected)

manifestVersion: 1

package:
  name: com.robonix.example.voiceprint_service
  version: 0.1.0
  vendor: robonix
  description: Voiceprint service (ECAPA-TDNN speaker identification) under robonix/system/voiceprint.
  license: MulanPSL-2.0

build: bash scripts/build.sh

start: |
  exec rbnx-build/venv/bin/python -m voiceprint_service.service

capabilities:
  - name: robonix/system/speech/voiceprint
