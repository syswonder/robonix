# Robonix voiceprint service — ECAPA-TDNN one-shot speaker identification.
# Three atlas-registered capabilities (all gRPC, all on the same listener):
#
#   robonix/system/speech/voiceprint         — Identify(audio) → user_id
#       Consumed by Liaison's voice gating path; LLM-visible only
#       indirectly via the user_id stamped on each Task.
#
#   robonix/system/speech/voiceprint_enroll  — Enroll(audio,id,name) → ok
#       Admin RPC. Used by `rbnx chat`'s Ctrl+U user-management modal
#       to register a new speaker from a freshly captured sample.
#
#   robonix/system/speech/voiceprint_list    — ListEnrolled() → json
#       Admin RPC. Returns the (user_id, user_name) catalog so the chat
#       client can hydrate its user list on modal open.
#
# Service id is `voiceprint` under the shared `robonix/system/speech`
# namespace; multiple Service instances can coexist in the same
# namespace (speech_service registers there too).
#
# Runtime config consumed via environment:
#   VOICEPRINT_DATA_DIR    — where enrolled.json lives
#                            (default <pkg>/rbnx-build/data)
#   VOICEPRINT_THRESHOLD   — cosine-similarity gate (default 0.25)
#   VOICEPRINT_DEVICE      — cuda:0 | cpu (auto-detected)

manifestVersion: 1

package:
  name: com.robonix.example.voiceprint_service
  version: 0.2.0
  vendor: robonix
  description: Voiceprint service (ECAPA-TDNN speaker identification).
  license: MulanPSL-2.0

build: bash scripts/build.sh

start: |
  # MUST start through `uv run` so the uv-managed venv at rbnx-build/venv/
  # is the one in use (auto-syncs deps if pyproject.toml changed since
  # build, and avoids the silent split between system python + bundled
  # venv that bit speech earlier). VIRTUAL_ENV + `--active` tells uv to
  # reuse the venv that build.sh created instead of spawning a new one.
  export VIRTUAL_ENV="$(pwd)/rbnx-build/venv"
  export PATH="$VIRTUAL_ENV/bin:$PATH"
  export PYTHONPATH="$(pwd)/rbnx-build/codegen/proto_gen:${PYTHONPATH:-}"
  exec uv run --active python -m voiceprint_service.service

capabilities:
  - name: robonix/system/speech/voiceprint
  - name: robonix/system/speech/voiceprint_enroll
  - name: robonix/system/speech/voiceprint_list
