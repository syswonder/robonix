# Robonix system service: voiceprint (ECAPA-TDNN speaker identification).
#
# uv-managed: `uv sync` (called from scripts/build.sh) materialises the
# local rbnx-build/venv/ from this file + the workspace uv.lock.

[project]
name = "robonix-system-voiceprint"
version = "0.1.0"
description = "Robonix Voiceprint Service — ECAPA-TDNN speaker identification."
requires-python = ">=3.10"
dependencies = [
    "speechbrain>=1.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.24",
    "numpy>=1.24,<2",
    "soundfile>=0.12",
    "huggingface-hub>=0.20",
]

[tool.uv]
package = false
