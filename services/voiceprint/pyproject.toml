# Robonix system service: voiceprint (sherpa-onnx CAM++ speaker identification).
#
# uv-managed: `uv sync` (called from scripts/build.sh) materialises the
# local rbnx-build/venv/ from this file + the workspace uv.lock.

[project]
name = "robonix-system-voiceprint"
version = "1.1.0b1"
description = "Robonix Voiceprint Service — sherpa-onnx CAM++ speaker identification."
requires-python = ">=3.10"
dependencies = [
    # robonix_api is the framework — Service / Ok / Err / lifecycle gRPC.
    # Sourced from the in-repo workspace (pylib/robonix-api) via the
    # [tool.uv.sources] table below. Without this dep the runtime dies
    # immediately with `ModuleNotFoundError: No module named 'robonix_api'`
    # — uv has no reason to materialise robonix-api into the venv unless
    # it is declared here.
    "robonix-api",
    "grpcio==1.80.0",
    "grpcio-tools==1.76.0",
    "protobuf==6.33.6",
    "numpy>=1.24,<2",
    "soundfile>=0.12",
    # CPU ONNX Runtime speaker embedding; the aarch64 wheel ships on PyPI.
    "sherpa-onnx>=1.12",
]

[tool.uv]
package = false

[tool.uv.sources]
robonix-api = { workspace = true }
