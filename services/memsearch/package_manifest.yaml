# Memsearch MCP server — agent long-term memory.
# Control plane: robonix/service/memory/{save,search,compact} plus the
# standard lifecycle driver used to build the initial index before ACTIVE.
manifestVersion: 1

package:
  name: com.robonix.example.memsearch_service
  version: 0.1.0
  vendor: robonix
  description: Memsearch MCP server — fact/preference memory for the agent.
  license: MulanPSL-2.0

# Atlas provider_id (matched verbatim by rbnx-boot). Distinct from package.name.

build: bash scripts/build.sh

start: |
  export PYTHONPATH="$(pwd)/rbnx-build/codegen/proto_gen:$(pwd)/rbnx-build/codegen/robonix_mcp_types:${PYTHONPATH:-}"
  mkdir -p rbnx-build/data
  # FastMCP internal logs are verbose — redirect to keep rbnx log clean.
  exec rbnx-build/venv/bin/python -m memsearch_service.service \
       > rbnx-build/data/memsearch.log 2>&1

stop: |
  pkill -TERM -f "[p]ython -m memsearch_service.service|[p]ython3 -m memsearch_service.service|[m]emsearch_service.service" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[p]ython -m memsearch_service.service|[p]ython3 -m memsearch_service.service|[m]emsearch_service.service" 2>/dev/null || true

capabilities:
  - name: robonix/service/memory/driver
  - name: robonix/service/memory/save
  - name: robonix/service/memory/search
  - name: robonix/service/memory/compact
