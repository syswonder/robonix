# Robonix stack for the benchmark: Atlas + Executor + the three body packages.
# Pilot's model comes from the environment (the ledger proxy in a benchmark run);
# with VLM_* unset, a plan can still be submitted straight to Executor.
name: embodiedosbench_robonix

system:
  atlas:
    listen: 127.0.0.1:50051
  executor:
    listen: 127.0.0.1:50061
  pilot:
    listen: 127.0.0.1:50071
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    pilot_endpoint: 127.0.0.1:50071

service:
  - name: body_navigate_to
    path: ./body_navigate_to
  - name: body_grasp
    path: ./body_grasp
  - name: body_place_on
    path: ./body_place_on
