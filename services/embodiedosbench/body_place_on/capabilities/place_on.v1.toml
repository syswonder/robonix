[contract]
id      = "robonix/service/body/place_on"
version = "1"
kind    = "service"
idl     = "body/srv/PlaceOn.srv"
description = "Place the object currently held on top of another scene object. Argument: the target object's instance name. Drive next to the target first. Returns a run_id at once; the placing continues in the background."

[mode]
type = "rpc"
