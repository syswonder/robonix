# TIAGo camera primitive, AIBOX deployment copy.
#
# This is examples/webots/primitives/tiago_camera forwarded over SSH: the
# driver still runs on the sim host (docker-exec'd into the sim container),
# but boot/Soma on the board spawn and supervise it through the wrapper
# scripts in ../scripts, so `rbnx boot` brings up the full split stack.
# Keep the provider identity (`name` here equals the driver's hard-coded
# Primitive id) and the capability list in sync with the upstream package.
manifestVersion: 1

package:
  name: com.robonix.example.tiago_camera
  version: 0.1.0
  vendor: wheatfox <wheatfox17@icloud.com>
  description: Tiago camera driver — RGB + depth head camera over Webots ROS2.
  license: MulanPSL-2.0

build: bash ../../scripts/remote_build.sh tiago_camera
start: bash ../../scripts/start.sh tiago_camera
stop: bash ../../scripts/stop.sh tiago_camera

capabilities:
  - name: robonix/primitive/camera/snapshot
  - name: robonix/primitive/camera/depth_snapshot
  # ROS2 streams (data plane). Topic names are runtime-resolved
  # through atlas — consumers (scene 3D fusion, mapping RGBD ingest)
  # discover them via QueryCapabilities, they never read the topic
  # strings declared in the driver source.
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/depth
  # Compatibility `base_link → camera_optical` transform. Scene uses the
  # complete TF tree first and composes pose + this latched transform only
  # when that authoritative lookup is unavailable.
  - name: robonix/primitive/camera/extrinsics
  # Static pinhole intrinsics (sensor_msgs/CameraInfo, latched). Lets
  # scene back-project depth with the real camera's K instead of a
  # hardcoded default — see capabilities/primitive/camera/intrinsics.v1.toml.
  - name: robonix/primitive/camera/intrinsics
