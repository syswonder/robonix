name: example_ci

env:
  LOG: "INFO"

system:
  atlas:
    listen: 127.0.0.1:50051
  executor:
    listen: 127.0.0.1:50061
  pilot:
    listen: 127.0.0.1:50071
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai

primitive:
  - name: test_primitive
    path: ./primitives/test_primitive

service:
  - name: test_service
    path: ./services/test_service

  - name: test_pkg_remote
    url: https://github.com/lhw2002426/test_pkg_remote.git

skill:
  - name: test_skills
    path: ./skills/test_skills
