manifestVersion: 1
name: robonix-webots-scene-evaluation

system:
  atlas:
    listen: 0.0.0.0:50051
  soma:
    # 50191, not the default 50091. A host may already be running another
    # deployment holding the default, and a benchmark boot then dies on
    # "Address already in use" before Scene ever starts. Scoring Scene must
    # not require tearing down a robot somebody else is using, so the
    # evaluation deployment moves aside instead.
    listen: 127.0.0.1:50191
    runtime_reader_command:
      - docker
      - exec
      - robonix_tiago_sim_scene177
      - bash
      - -lc
      - source /opt/ros/humble/setup.bash && exec python3 -u /robonix_runtime/soma/soma_runtime_ros.py /robonix_runtime/soma/soma_runtime_sources.json
  scene:
    manifest: package_manifest.yaml
    config:
      perception:
        period_s: 0.6
        confidence_threshold: 0.30
        max_detections: 30
primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config: {}
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      width: 640
      height: 480
      fx: 554.0
      fy: 554.0
      cx: 320.0
      cy: 240.0
      sentinel_timeout_s: 150
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      sentinel_timeout_s: 150

service:
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    branch: main
    config:
      use_sim_time: true
      # Match the validated Webots deployment: planar lidar owns persistent
      # structural occupancy; RGB-D remains a registration/loop-closure input.
      occupancy_sources: [lidar]
      rtabmap_inputs: [lidar, rgbd, odom]
      params_file: config/rtabmap_params.yaml
      sensor_providers:
        lidar2d: tiago_lidar
        rgb: tiago_camera
        depth: tiago_camera
        odom: tiago_chassis
