urdf:
  path: ./sim/ros_ws/src/eaios_webots/resource/tiago_webots.urdf
  root_link: base_link
  model_name: tiago_webots

robot:
  id: tiago_webots
  display_name: "Webots TIAGo Lite mobile robot"
  family: mobile_robot
  root_part: base
  # Webots R2025a TiagoBase uses a cylindrical bumper/base_cover collision
  # with radius 0.272 m. Keep the Soma footprint tied to that simulator body
  # model so nav2 does not overestimate the robot as a 0.70 m long rectangle.
  dimensions: { length_m: 0.544, width_m: 0.544, height_m: 1.10 }
  footprint:
    base_frame: base_link
    # 2D collision hull in base_frame, CCW, first point not repeated.
    # Consumers such as navigation must read this through Soma instead of
    # hardcoding Tiago/Webots dimensions in their own package configs.
    points:
      - [0.272, 0.272]
      - [0.272, -0.272]
      - [-0.272, -0.272]
      - [-0.272, 0.272]
  mass_kg: 55.0
  passable_door_width_m: 0.80
  exports:
    - provider_id: tiago_health
      capabilities:
        - { path: robonix/primitive/health/state, description: "Read the current simulated TIAGo hardware health state." }
        - { path: robonix/primitive/health/stream, description: "Stream simulated TIAGo hardware health into Soma." }
    - provider_id: tiago_webots_nav2
      capabilities:
        - { path: robonix/service/navigation/navigate, description: "Navigate to a 2D goal in the mapped scene." }
        - { path: robonix/service/navigation/navigate/status, description: "Report the current navigation goal status." }
        - { path: robonix/service/navigation/navigate/cancel, description: "Cancel the active navigation goal." }
    - provider_id: skill_explore_room
      capabilities:
        # Capability paths must match what the explore_rbnx package
        # actually exports in its package_manifest.yaml. The upstream
        # skill exposes `explore` (start), `explore/status` (poll) and
        # `explore/cancel` (abort) — there is no `explore/room`
        # capability; the old name here was aspirational and produced
        # "unknown capability" at soma load time.
        - { path: robonix/skill/explore/explore, description: "Run autonomous frontier exploration when the explore skill package is available." }
        - { path: robonix/skill/explore/explore/status, description: "Report the current frontier-exploration task status." }
        - { path: robonix/skill/explore/explore/cancel, description: "Cancel the active frontier-exploration task." }
  components:
    - id: base
      type: mobile_base
      urdf_link: base_link
      exports:
        - provider_id: tiago_webots_chassis
          capabilities:
            - { path: robonix/primitive/chassis/move, description: "Command chassis motion through Webots ROS2 velocity control." }
            - { path: robonix/primitive/chassis/odom, description: "Read odometry from the simulated differential drive base." }
            - { path: robonix/primitive/chassis/twist_in, description: "Accept velocity commands on the chassis command input." }
      components:
        - id: left_wheel
          type: wheel
          urdf_joint: wheel_left_joint
          exports: []
        - id: right_wheel
          type: wheel
          urdf_joint: wheel_right_joint
          exports: []
        - id: battery
          type: battery
          exports: []
    - id: head_camera
      type: rgbd_camera
      urdf_link: head_front_camera_rgb_optical_frame
      exports:
        - provider_id: tiago_webots_camera
          capabilities:
            - { path: robonix/primitive/camera/snapshot, description: "Capture an RGB image from the Webots head camera." }
            - { path: robonix/primitive/camera/depth_snapshot, description: "Capture a registered depth image from the Webots head camera." }
            - { path: robonix/primitive/camera/rgb, description: "Expose the RGB image stream for consumers such as mapping." }
            - { path: robonix/primitive/camera/depth, description: "Expose the depth image stream for consumers such as mapping." }
            - { path: robonix/primitive/camera/extrinsics, description: "Provide the camera transform relative to the robot base." }
    - id: hokuyo_lidar
      type: lidar_2d
      urdf_link: base_laser_link
      exports:
        - provider_id: tiago_webots_lidar
          capabilities:
            - { path: robonix/primitive/lidar/snapshot, description: "Capture a planar laser scan from the simulated Hokuyo lidar." }
    - id: audio
      type: audio_io
      exports:
        - provider_id: tiago_webots_audio
          capabilities:
            - { path: robonix/primitive/audio/mic, description: "Stream microphone audio from the selected host ALSA input device." }
            - { path: robonix/primitive/audio/speaker, description: "Play streamed audio through the selected host ALSA output device." }
            - { path: robonix/primitive/audio/list_devices, description: "List available host ALSA audio devices." }
            - { path: robonix/primitive/audio/select_device, description: "Select the active host ALSA audio device." }

description:
  summary: "A Webots TIAGo Lite deployment with chassis, RGB-D camera, planar lidar, simulated hardware health, audio IO, mapping, navigation, and optional exploration packages."
  can_do:
    - "Drive in the simulated office world using velocity commands."
    - "Navigate to 2D goals using the simple_nav service and Webots sensor data."
    - "Capture RGB images, registered depth images, and planar lidar scans."
    - "Publish nominal simulated battery, wheel, and sensor health through Soma."
    - "Provide microphone and speaker audio through the host audio driver."
  cannot_do:
    - "Manipulate objects; this Webots package does not deploy an arm or gripper primitive."
    - "Control physical TIAGo hardware."
    - "Use IMU or 3D point cloud data in the current deployment."
  notes:
    - "Soma v2 serves this file and the referenced URDF as raw text; primitive and skill startup is driven by robonix_manifest.yaml."
    - "The Webots simulation stack under sim/ must be started before packages that docker-exec into the simulator container."
