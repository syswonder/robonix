# Webots Tiago RTAB-Map parameters. This file is owned by this deployment.
# Depth builds the grid on demand here; per-node grid caching stacks every
# node's local grid into the radial smear. Save/load is validated by CI.
RGBD/CreateOccupancyGrid: false
Grid/RangeMax: 6.0
Grid/CellSize: 0.05
Grid/RayTracing: true # false leaves ghost points - wheatfox 2026.7.19
Grid/3D: false
Grid/NormalsSegmentation: false
Grid/MaxObstacleHeight: 1.0
Grid/MaxGroundHeight: 0.1
# Vis+ICP for loop closures only; neighbour links below stay on odometry
# because ICP on repetitive walls duplicates them during in-place rotation.
Reg/Strategy: 2
Reg/Force3DoF: true
Optimizer/Strategy: 1
RGBD/NeighborLinkRefining: false
# Wheel odometry drifts over a long explore and nothing else corrects it,
# so allow proximity loop closures. Neighbour links stay on odometry.
RGBD/ProximityBySpace: true
RGBD/OptimizeMaxError: 3.0
RGBD/AngularUpdate: 0.03
RGBD/LinearUpdate: 0.03
Mem/NotLinkedNodesKept: true
Vis/MinInliers: 12
Rtabmap/DetectionRate: 5.0
Icp/MaxCorrespondenceDistance: 0.2
Icp/MaxTranslation: 0.5
Icp/MaxRotation: 0.78
