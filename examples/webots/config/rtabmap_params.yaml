# Webots Tiago RTAB-Map parameters. This file is owned by this deployment.
RGBD/CreateOccupancyGrid: true
Grid/RangeMax: 6.0
Grid/CellSize: 0.05
Grid/RayTracing: true # false leaves ghost points - wheatfox 2026.7.19
Grid/3D: false
Grid/NormalsSegmentation: false
Grid/MaxObstacleHeight: 1.0
Grid/MaxGroundHeight: 0.1
# Webots odometry is exact; letting ICP refine it duplicates walls
# during in-place rotation. Vis stays for global relocalization.
Reg/Strategy: 0
Reg/Force3DoF: true
Optimizer/Strategy: 1
RGBD/NeighborLinkRefining: false
RGBD/ProximityBySpace: false
RGBD/AngularUpdate: 0.03
RGBD/LinearUpdate: 0.03
Mem/NotLinkedNodesKept: true
Vis/MinInliers: 12
Rtabmap/DetectionRate: 5.0
Icp/MaxCorrespondenceDistance: 0.2
Icp/MaxTranslation: 0.5
Icp/MaxRotation: 0.78
