# simple_nav — minimal navigation service for the webots demo.
# Goto + lidar avoidance, no full Nav2. Runs INSIDE the webots sim
# container via docker-exec (same pattern as primitive drivers) so
# it can use the sim's ROS Humble + rclpy without an extra image.
#
# Capabilities (all over MCP, std_msgs/String JSON envelopes):
#   robonix/service/navigation/navigate  → start a goto (target_x, target_y)
#   robonix/service/navigation/status    → query current goal status
#   robonix/service/navigation/cancel    → cancel the active goal
manifestVersion: 1

package:
  name: com.robonix.example.simple_nav
  version: 0.1.0
  vendor: robonix
  description: Lightweight goto-with-avoidance nav service for webots tiago.
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/service/navigation/navigate
  - name: robonix/service/navigation/status
  - name: robonix/service/navigation/cancel
