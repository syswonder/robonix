# macOS-bridge debug variant of robonix_manifest.yaml.
#
# Same stack as the webots default, but the audio primitive is
# replaced by `audio_macos_bridge` — mic + speaker physically live on
# a macOS box across the LAN, while atlas / pilot / liaison / sim run
# here on Linux. Pair with `~/robonix-scripts/mac_server/server.py`
# running on the macOS host.
#
# Run with:
#   rbnx boot -f robonix_manifest.macos_debug.yaml
#
# Adjust `host:` in audio_macos_bridge config below to your macOS
# tailscale / LAN address. Everything else is identical to the
# default manifest, including the `system: speech: disable_whisper`
# flag (voice path uses FunASR streaming, not Whisper).
manifestVersion: 1
name: robonix-webots-macos-debug-deploy

env:

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info
  # nexus:
  #   log: info
  memory:
    backend: sqlite
    log: info
  speech:
    log: info
    disable_whisper: true
    funasr_device: cuda
    tts_voice: zh-CN-XiaoxiaoNeural
  scene:
    log: info

primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config:
      can_port: /dev/can0
      odom_frame: odom
      base_frame: base_link
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      serial_no: 1234567890
      fps: 30
      width: 640
      height: 480
      frame_id: head_front_camera_rgb_optical_frame
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      update_rate: 10
      frame_id: lidar

  # ── audio: macOS bridge variant ──────────────────────────────────────────
  # Replaces the local ALSA `audio_driver`. The Linux side here is just
  # a thin proxy over WebSocket; real PCM I/O lives in
  # ~/robonix-scripts/mac_server/server.py on the macOS host.
  - name: audio_macos_bridge
    path: ./primitives/audio_macos_bridge
    config:
      host: 100.78.199.22       # macOS tailscale address
      port: 60000

service:
  - name: mapping
    url: https://github.com/enkerewpo/mapping_rbnx
    branch: main
    config:
      algo: rtabmap
      platform: x86_desktop
      sensors:
        lidar2d: true
        lidar3d: false
        rgb: true
        depth: true
        imu: false
        odom: true
  - name: simple_nav
    path: ./services/simple_nav
    config:
      robot_radius: 0.25
      follower_hz: 20
      max_linear: 0.5
      max_angular: 1.0
      pid_linear: [ 0.8, 0.0, 0.1 ]
      pid_angular: [ 1.5, 0.0, 0.2 ]
      goal_tolerance: 0.3
      goal_yaw_tolerance: 0.2
      timeout: 120
      planner_diagonal: true
      planner_max_iters: 500000

skill:
  - name: explore
    url: https://github.com/enkerewpo/explore_rbnx
    branch: main
    config:
      explore_mode: frontier
      timeout_s: 600
