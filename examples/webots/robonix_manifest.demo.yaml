# Webots full-stack demo manifest — sim + speech + voiceprint + sentinel.
#
# Differs from the default robonix_manifest.yaml in three ways:
#   1. Adds `speech` service (services/speech) — FunASR + edge-tts + speak/list_speakers.
#   2. Adds `voiceprint` service (services/voiceprint) — ECAPA-TDNN identify+enroll+list.
#   3. Documents the sentinel POC env wiring (rule file lives at
#      `examples/webots/sentinel.demo.yaml`).
#
# Why a separate manifest: the default robonix_manifest.yaml exercises the
# *minimum* stack needed to verify a webots boot (chassis/camera/lidar +
# audio_driver + mapping + simple_nav + explore). This one is the
# kitchen-sink build used to validate speech / voiceprint / sentinel POC
# changes against the sim before they ever touch the real car.
#
# Run:
#   export VLM_BASE_URL=...
#   export VLM_API_KEY=...
#   export VLM_MODEL=...
#   export SENTINEL_RULES_FILE=$(realpath examples/webots/sentinel.demo.yaml)
#   cd examples/webots
#   rbnx boot -f robonix_manifest.demo.yaml
manifestVersion: 1
name: robonix-webots-demo-deploy

env:

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  scene:
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
    # Sentinel rules are loaded by the executor at startup; the env
    # SENTINEL_RULES_FILE in the launching shell takes precedence over
    # this manifest key. Set it BEFORE `rbnx boot`.
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info

primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config:
      can_port: /dev/can0
      odom_frame: odom
      base_frame: base_link
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      serial_no: 1234567890
      fps: 30
      width: 640
      height: 480
      frame_id: head_front_camera_rgb_optical_frame
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      update_rate: 10
      frame_id: lidar
  # Local ALSA mic + speaker. Default audio path for the demo —
  # `Settings (Ctrl+,) → Audio` lets the operator pin this as both
  # mic + speaker provider, or pick the macOS bridge below for mic
  # while keeping audio_driver as the speaker.
  - name: audio_driver
    path: ./primitives/audio_driver
    config: {}

  # Optional macOS bridge — registers a SECOND set of
  # robonix/primitive/audio/{mic,speaker,driver} providers backed by
  # a WebSocket to ~/robonix-scripts/mac_server/server.py running on
  # a macOS host. When that script isn't running this primitive enters
  # ERROR state but doesn't affect anything else. Toggle in chat via
  # Settings → Audio → mic provider = audio_macos_bridge.
  #
  # Update `host:` to your macOS LAN / tailscale address before boot.
  - name: audio_macos_bridge
    path: ./primitives/audio_macos_bridge
    config:
      host: 100.78.199.22   # ← UPDATE: macOS tailscale / LAN address
      port: 60000

service:
  - name: mapping
    url: https://github.com/enkerewpo/mapping_rbnx
    branch: main
    config:
      algo: rtabmap
      platform: x86_desktop
      sensors:
        lidar2d: true
        lidar3d: false
        rgb: true
        rgbd: true
        imu: false
        odom: true

  - name: simple_nav
    path: ./services/simple_nav
    config:
      robot_radius: 0.25
      follower_hz: 20
      max_linear: 0.5
      max_angular: 1.0
      pid_linear: [0.8, 0.0, 0.1]
      pid_angular: [1.5, 0.0, 0.2]
      goal_tolerance: 0.3
      goal_yaw_tolerance: 0.2
      timeout: 120
      planner_diagonal: true
      planner_max_iters: 500000

  # ── memory / speech / voiceprint — regular services living under
  # the top-level `services/` tree. They boot like any other service —
  # robonix-api Service instance, atlas-registered capabilities, lifecycle
  # gRPC. Path: ../../services/X reaches them from this manifest's dir.
  - name: memory
    path: ../../services/memsearch
    config:
      backend: sqlite
  - name: speech
    path: ../../services/speech
    config:
      disable_whisper: true   # webots ASR uses FunASR streaming
  - name: voiceprint
    path: ../../services/voiceprint
    config:
      # ECAPA-TDNN forced to CPU on this 6GB RTX 2060 — scene
      # (YOLO+SAM+CLIP, ~2.4G) + speech (FunASR+edge-tts, ~1G) +
      # chrome (~0.5G) already eat ~4G, leaving <500MB free. ASR's
      # cuBLAS workspace alloc on the 2nd Ctrl+V then fails with
      # CUBLAS_STATUS_ALLOC_FAILED. Voiceprint inference is tiny
      # (16k×5s clip, <200ms on CPU) so the GPU savings are free.
      device: cpu

skill:
  - name: explore
    url: https://github.com/enkerewpo/explore_rbnx
    branch: main
    config:
      explore_mode: frontier
      timeout_s: 600
