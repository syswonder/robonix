# Tiago camera driver — primitive package.
# One device = one package. Exposes the head front camera (RGB + depth):
#   robonix/primitive/camera/snapshot        → camera_snapshot(Empty) → Image (JPEG)
#   robonix/primitive/camera/depth_snapshot  → camera_depth_snapshot(Empty) → Image (JPEG)
#
# TODO: gRPC stream contract `robonix/primitive/camera/rgb`
# (PrmCameraRgb.Stream) is not exposed yet; add when a consumer needs
# continuous frames rather than on-demand snapshots.
manifestVersion: 1

package:
  name: com.robonix.example.tiago_camera
  version: 0.1.0
  vendor: robonix
  description: Tiago camera driver — RGB + depth head camera over Webots ROS2.
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/primitive/camera/snapshot
  - name: robonix/primitive/camera/depth_snapshot
  - name: robonix/primitive/camera/driver
  # ROS2 streams (data plane). Topic names are runtime-resolved
  # through atlas — consumers (scene 3D fusion, mapping RGBD ingest)
  # discover them via QueryCapabilities, they never read the topic
  # strings declared in the driver source.
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/depth
  # Static `base_link → camera_optical` transform. Latched (TRANSIENT_LOCAL)
  # so late subscribers receive the cached value. Lets scene compose
  # T(world ← camera_optical) = service/map/pose ⊕ camera/extrinsics
  # without touching tf2 at all.
  - name: robonix/primitive/camera/extrinsics
