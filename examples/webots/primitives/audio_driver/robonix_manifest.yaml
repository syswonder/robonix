manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.audio_driver
  name: audio_driver
  version: 0.1.0
  vendor: robonix
  description: Audio driver (mic capture + speaker playback) for robonix/prm/audio contracts
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.prm.audio
    type: python
    start: |
      export PYTHONPATH="$(pwd)/proto_gen:${PYTHONPATH:-}"
      exec python -m audio_driver.node
