# TODO: migrate to `package_manifest.yaml` - wheatfox
manifestVersion: 1

build:
  script: scripts/build.sh

package:
  id: com.robonix.example.audio_driver
  name: audio_driver
  version: 0.1.0
  vendor: robonix
  description: Audio driver (mic capture + speaker playback) for robonix/primitive/audio contracts
  license: MulanPSL-2.0

nodes:
  - id: com.robonix.primitive.audio
    type: python
    start: |
      # Capability framework (robonix-py) + per-package codegen.
      # arecord / aplay run on the host directly; no sim container.
      export PYTHONPATH="$(rbnx path robonix-py):$(pwd)/rbnx-build/codegen/proto_gen:$(pwd)/proto_gen:${PYTHONPATH:-}"
      exec python3 -m audio_driver.node
