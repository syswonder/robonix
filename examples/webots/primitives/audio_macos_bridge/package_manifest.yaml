# Audio primitive (macOS bridge variant) — drop-in replacement for the
# default ALSA `audio_driver` package when you want robonix's audio I/O
# physically on a macOS machine while atlas/pilot/liaison run on Linux.
#
# Pairs with the `mac_server/server.py` script — that one runs on the
# macOS box and exposes mic capture + speaker playback over a tiny
# WebSocket protocol; this package runs on the Linux host, registers
# the usual `robonix/primitive/audio/{mic,speaker,driver}` contracts
# with atlas, and just relays PCM frames to/from that WebSocket.
#
# Toggle by commenting one line in `examples/webots/robonix_manifest.yaml`:
#
#   primitive:
#     # - name: audio_driver
#     #   path: ./primitives/audio_driver
#     - name: audio_macos_bridge
#       path: ./primitives/audio_macos_bridge
#       config:
#         host: 192.168.1.42      # macOS LAN address running mac_server
#         port: 60000             # default
#
# Same wire format as audio_driver (16 kHz / mono / s16le PCM in
# AudioChunk frames) so liaison / scene / TTS see no difference.
manifestVersion: 1

package:
  name: com.robonix.example.audio_macos_bridge
  version: 0.1.0
  vendor: robonix
  description: Audio primitive that proxies mic/speaker over WebSocket to a macOS daemon.
  license: MulanPSL-2.0

# Distinct provider_id from `audio_driver` (`.alsa`) so both can co-exist in
# atlas — the rbnx chat provider_id picker then has a real choice. Same
# `robonix/primitive/audio/*` contract surface as audio_driver, so
# consumers (liaison voice path, scene optional audio) don't care
# which backend is loaded.

build: bash scripts/build.sh
start: bash scripts/start.sh

# 1 package = 1 cap. The mac_server daemon on the
# macOS side enumerates CoreAudio devices; we surface them through the
# optional list_devices/select_device contracts so the user can pick
# which physical mic/speaker the cap's driver routes to. Those CoreAudio
# devices are driver-internal — not separate robonix caps.
stop: |
  pkill -TERM -f "[p]ython3 -m audio_macos_bridge.main" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[p]ython3 -m audio_macos_bridge.main" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/audio/mic
  - name: robonix/primitive/audio/speaker
  - name: robonix/primitive/audio/driver
  - name: robonix/primitive/audio/list_devices
  - name: robonix/primitive/audio/select_device
