# SPDX-License-Identifier: MulanPSL-2.0

manifestVersion: 1

package:
  name: com.robonix.example.tiago_health
  version: 0.1.0
  vendor: robonix
  description: Nominal simulated hardware health for the Webots TIAGo deployment.
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

stop: |
  SIM_CT="${ROBONIX_SIM_CONTAINER:-robonix_tiago_sim}"
  docker exec "$SIM_CT" pkill -TERM -f "[p]ython3 -m tiago_health.driver" 2>/dev/null || true
  sleep 1
  docker exec "$SIM_CT" pkill -KILL -f "[p]ython3 -m tiago_health.driver" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/health/state
  - name: robonix/primitive/health/stream
  - name: robonix/primitive/health/driver
