manifestVersion: 1
name: robonix-webots-example-deploy

env:
  # ${VAR} in the blocks below resolves from the launching shell. This
  # `env:` block is the place to inject extras / overrides for children.

system:
  atlas:
    listen: 127.0.0.1:50051
    log:    info
  executor:
    listen: 127.0.0.1:50061
    log:    info
  pilot:
    listen: 127.0.0.1:50071
    log:    info
    vlm:
      upstream:   ${VLM_BASE_URL}
      api_key:    ${VLM_API_KEY}
      model:      ${VLM_MODEL}
      api_format: openai

primitive: []
# TODO: add tiago_sim_stack here once it grows a `*/driver` lifecycle
# interface (Phase B of task #37). Deploy waits for `*/driver` over gRPC
# and calls Driver(CMD_INIT) before moving on; tiago_sim_stack currently
# registers via the legacy RegisterNode/DeclareInterface API and would
# deadlock the deploy loop. Until then, start it manually:
#   rbnx start -p ./primitives/tiago_sim_stack

service: []

skill: []
