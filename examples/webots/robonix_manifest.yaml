manifestVersion: 1
name: robonix-webots-example-deploy

env:
  # ${VAR} in the blocks below resolves from the launching shell. This
  # `env:` block is the place to inject extras / overrides for children.

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  # Non-builtin system entries (key != atlas/executor/pilot) are
  # auto-resolved as packages at <robonix_source>/system/<key>/. The
  # value below is handed to the package as RBNX_CONFIG_FILE; pass `{}`
  # if the package needs no per-deploy config. Keys whose package dir
  # doesn't exist on disk are skipped with a warning, not fatal — keep
  # placeholders here for services that are planned but not yet vendored.
  liaison:
    listen: 127.0.0.1:50081
    log: info
  nexus:
    log: info
  memory:
    backend: sqlite
    log: info
  speech:
    log: info
  # Scene auto-discovers its observation topics from atlas at startup
  # (see scene_service/service.py `_discover_observations`). No per-
  # deploy config needed: scene asks atlas for every cap with a
  # ROS2-transport topic_out interface, recognises the contract leaf
  # (rgb / depth / lidar2d / pose / odom / lidar3d), and subscribes
  # accordingly. To override or disable a kind for a specific
  # deployment, add an `observations:` block here — but the default
  # is intentionally empty.
  scene:
    log: info

primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config: []
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      serial_no: 1234567890
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      resolution: 0.08
      min_range: 0.3
      max_range: 50.0
      frame_id: base_link
      topic_prefix: /lidar-robonix
  # audio_driver integration WIP
  # - name: audio_driver
  #   path: ./primitives/audio_driver
  #   config: {}

service:
  # ── navigation ─────────────────────────────────────────────────────
  # `simple_nav` IS the navigation service for this deploy. The
  # package directory is named after the implementation; the contract
  # namespace it declares on atlas is `robonix/service/navigation/*`
  # (navigate, status, cancel). Consumers (explore, pilot via MCP)
  # only ever know the contract namespace, so swapping in a nav2
  # wrapper later means dropping in a different package that declares
  # the same three contracts — no caller-side change.
  #
  # Implementation: A* on rtabmap's /map (35 cm inscribed + 40 cm
  # inflation costmap) → Regulated Pure Pursuit follower → publishes
  # /cmd_vel. Re-validates the cached path on every /map update and
  # auto-replans if a waypoint becomes blocked. 360° lidar emergency
  # stop. Target_yaw align phase. NOT Nav2 — Nav2 would live as a
  # separate package (e.g. `services/nav2_wrapper/`) declaring the
  # same `robonix/service/navigation/*` contract surface; that's the
  # planned path for the Ranger Mini deploy.
  - name: simple_nav
    path: ./services/simple_nav
    config: {}

  # mapping_rbnx — SLAM service. Algos shipped: rtabmap (sensor-
  # agnostic graph SLAM; deploy-driven via the sensors: block below),
  # dlio (3D Livox + IMU; real robot path), fastlio2 [BROKEN: drift].
  # slam_toolbox + cartographer were removed after rtabmap
  # consistently outperformed them on curve-motion mapping. Output
  # contracts (algo-agnostic): robonix/service/map/{occupancy_grid,
  # pointcloud}. Container uses FastRTPS UDP-only profile so it sees
  # the sim's DDS topics without a Zenoh bridge.
  - name: mapping
    url: https://github.com/enkerewpo/mapping_rbnx
    branch: main
    config:
      algo: rtabmap
      platform: x86_desktop
      sensors:
        lidar2d: true
        lidar3d: false
        rgb: true # rtabmap fuses RGB for visual loop closure
        rgbd: true # depth fills below-lidar-plane obstacles
        imu: false
        odom: true

skill:
  # explore_rbnx — autonomous frontier exploration. Contract kind is
  # `skill` (user-invocable, declared at robonix/skill/explore/*) but
  # we deploy it under `service:` because rbnx CLI's `skill:` section
  # is currently parsed-and-skipped (line 18-20 of deploy.rs: "NOT
  # started at deploy time — the executor invokes them on demand"),
  # and that on-demand spawn isn't yet implemented in executor. The
  # process needs to be alive so its MCP tools register with atlas;
  # `service:` slot achieves that without changing the contract type.
  # When rbnx CLI grows real skill-spawn semantics this entry can move.
  - name: explore
    url: https://github.com/enkerewpo/explore_rbnx
    branch: main
    config: {}
