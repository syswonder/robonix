manifestVersion: 1
name: robonix-webots-example-deploy

env:

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info
  nexus:
    log: info
  memory:
    backend: sqlite
    log: info
  speech:
    log: info

    # ── Whisper (one-shot, asr contract) ────────────────────────────
    # `robonix/system/speech/asr` takes a whole utterance and returns
    # one transcript. Costs 6 GB of weights. Disabled by default since
    # rbnx chat / dialog use the streaming path below.
    disable_whisper: true
    # asr_model:        openai/whisper-large-v3
    # asr_device:       cuda          # cuda | cpu
    # asr_chunk_length: 30.0          # long-form chunk seconds
    # asr_batch_size:   4

    # ── FunASR (streaming, asr_stream contract) ─────────────────────
    # Handles `robonix/system/speech/asr_stream` — paraformer-zh-stream
    # bidi gRPC, used by liaison voice + rbnx ask. Tiny (~80 MB).
    # `cuda` is the production default — CPU is fast enough on paper
    # but the per-chunk decode latency drops words on real hardware.
    # If scene's YOLO+SAM+CLIP already filled the card, set `auto`
    # for graceful CPU fallback, or `cpu` to force CPU.
    funasr_device: cuda
    # funasr_model:      paraformer-zh-streaming
    # funasr_chunk_size: [0, 10, 5]   # [left, current, right]

    # ── Edge TTS (synthesize / synthesize_stream contracts) ─────────
    tts_voice: zh-CN-XiaoxiaoNeural
  scene:
    log: info

# the robonix boot "device tree"
# if any primitive/service/skill failed to start, it should return "DERERED" 
# and rbnx will put it into defered queue and retry it later
primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config:
      # example place holders
      can_port: /dev/can0
      odom_frame: odom
      base_frame: base_link
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      # example place holders
      serial_no: 1234567890
      fps: 30
      width: 640
      height: 480
      frame_id: head_front_camera_rgb_optical_frame
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      # example place holders
      update_rate: 10
      frame_id: lidar
  - name: audio_driver
    path: ./primitives/audio_driver
    config: {}

service:
  # mapping_rbnx — SLAM service. Listed FIRST because simple_nav
  # depends on `service/map/occupancy_grid` and rbnx-cli currently
  # boots services in manifest order; until the defer-queue lands
  # consumers must come after their providers.
  - name: mapping
    url: https://github.com/enkerewpo/mapping_rbnx
    branch: main
    config:
      algo: rtabmap
      platform: x86_desktop
      sensors:
        lidar2d: true # webots do not have 3d pointcloud, so we use 2d lidar
        lidar3d: false
        rgb: true # rtabmap fuses RGB for visual loop closure
        rgbd: true # depth fills below-lidar-plane obstacles
        imu: false
        odom: true

  # `simple_nav` IS the navigation service for this deploy.
  #
  # Implementation: A* on rtabmap's /map (35 cm inscribed + 40 cm
  # inflation costmap) → Regulated Pure Pursuit follower → publishes
  # /cmd_vel. Re-validates the cached path on every /map update and
  # auto-replans if a waypoint becomes blocked. 360° lidar emergency
  # stop. Target_yaw align phase.
  - name: simple_nav
    path: ./services/simple_nav
    config:
      # just examples place holders, we passthrough it to the service when calling INIT
      robot_radius: 0.25
      follower_hz: 20
      max_linear: 0.5
      max_angular: 1.0
      pid_linear: [ 0.8, 0.0, 0.1 ]
      pid_angular: [ 1.5, 0.0, 0.2 ]
      goal_tolerance: 0.3
      goal_yaw_tolerance: 0.2
      timeout: 120
      planner_diagonal: true
      planner_max_iters: 500000

skill:
  # explore_rbnx — autonomous frontier exploration.
  - name: explore
    url: https://github.com/enkerewpo/explore_rbnx
    branch: main
    config:
      # example place holders
      explore_mode: frontier
      timeout_s: 600
