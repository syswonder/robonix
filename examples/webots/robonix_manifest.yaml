manifestVersion: 1
name: robonix-webots-example-deploy

env:
  # ${VAR} in the blocks below resolves from the launching shell. This
  # `env:` block is the place to inject extras / overrides for children.

system:
  atlas:
    listen: 127.0.0.1:50051
    log:    info
  executor:
    listen: 127.0.0.1:50061
    log:    info
  pilot:
    listen: 127.0.0.1:50071
    log:    info
    vlm:
      upstream:   ${VLM_BASE_URL}
      api_key:    ${VLM_API_KEY}
      model:      ${VLM_MODEL}
      api_format: openai

# Primitive driver packages — each is one device, one process. Every
# entry below docker-exec's into the pre-running sim container (from
# `bash sim/start.sh`) and registers its caps to atlas. Make sure sim
# is up FIRST: `bash examples/webots/sim/start.sh`.
#
# These drivers still use the legacy RegisterNode + DeclareInterface
# atlas API (no `*/driver` interface). Until that migration lands,
# `rbnx deploy` would block waiting for Driver(CMD_INIT). Run them
# manually for now (one terminal each):
#   rbnx start -p ./primitives/tiago_chassis
#   rbnx start -p ./primitives/tiago_camera
#   rbnx start -p ./primitives/tiago_lidar
#   rbnx start -p ./services/tiago_nav2
primitive: []
# TODO: when each driver gains a `*/driver` lifecycle interface,
# uncomment:
# primitive:
#   - { name: tiago_chassis, path: ./primitives/tiago_chassis }
#   - { name: tiago_camera,  path: ./primitives/tiago_camera  }
#   - { name: tiago_lidar,   path: ./primitives/tiago_lidar   }

service: []
# TODO: same migration; planned:
# service:
#   - { name: tiago_nav2, path: ./services/tiago_nav2 }

skill: []
