# Sentinel rules — demo build (always-on, designed to fire on first attempt).
#
# Wire this into a deploy by exporting the env BEFORE `rbnx boot`:
#
#   export SENTINEL_RULES_FILE=$(realpath examples/webots/sentinel.demo.yaml)
#   rbnx boot -f examples/webots/robonix_manifest.demo.yaml
#
# The rule below blocks every call to `robonix/system/speech/speak`.
# Run the chat and ask the agent to say something — pilot's plan will
# include a `speech.speak(...)` step, executor's sentinel hook intercepts,
# and the chat surfaces:
#
#   sentinel:demo_block_speak: 演示用规则,speak 已被 sentinel 拦截
#
# Once you've seen the rule fire, narrow `deny_between` (e.g. to
# ["22:00", "07:00"]) to re-enable normal speak during the day.
version: 1
rules:
  - id: demo_block_speak
    contract_id: robonix/system/speech/speak
    deny_between: ["00:00", "23:59"]   # always-deny for the demo flip
    reason: "演示用规则:speak 已被 sentinel 拦截 (改 deny_between 解除)"
