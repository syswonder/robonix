# Sentinel policy — webots demo deploy.
#
# Loaded by the executor at startup via SENTINEL_RULES_FILE:
#
#   export SENTINEL_RULES_FILE=$(realpath examples/webots/sentinel.demo.yaml)
#   rbnx boot -f examples/webots/robonix_manifest.demo.yaml
#
# The rule below illustrates a quiet-hours policy:speaker output is
# blocked for the entire day so the demo can show sentinel firing on
# the first attempt. To return to normal daytime use, narrow the
# deny_between window (e.g. ["22:00", "07:00"]) and reboot.
version: 1
rules:
  - id: quiet_hours_speaker
    contract_id: robonix/service/speech/speak
    deny_between: ["00:00", "23:59"]
    reason: "quiet-hours 策略:当前时段禁止扬声器输出。"
