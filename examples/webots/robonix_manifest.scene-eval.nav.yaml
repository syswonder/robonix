manifestVersion: 1
name: robonix-webots-scene-evaluation-nav

system:
  atlas:
    listen: 0.0.0.0:50051
  soma:
    # 50191, not the default 50091. A host may already be running another
    # deployment holding the default, and a benchmark boot then dies on
    # "Address already in use" before Scene ever starts. Scoring Scene must
    # not require tearing down a robot somebody else is using, so the
    # evaluation deployment moves aside instead.
    listen: 127.0.0.1:50191
    # The reader runs inside the simulator's container, so the container has to
    # be named -- the same literal `robonix_manifest.yaml` uses, and the default
    # `ROBONIX_SIM_CONTAINER` carries on the shell side (sim/runtime_state.sh).
    # Not `${ROBONIX_SIM_CONTAINER}`: rbnx expands an unset variable to an empty
    # string, so a forgotten export would run `docker exec "" bash` and fail
    # with something about docker rather than about the manifest. A deployment
    # running the simulator under another name, or not under docker at all,
    # replaces this whole command rather than editing a name buried in it.
    runtime_reader_command:
      - docker
      - exec
      - robonix_tiago_sim
      - bash
      - -lc
      - source /opt/ros/humble/setup.bash && exec python3 -u /robonix_runtime/soma/soma_runtime_ros.py /robonix_runtime/soma/soma_runtime_sources.json
  scene:
    manifest: package_manifest.yaml
    config:
      perception:
        # No `backend` here on purpose. SCENE_PERCEPTION_BACKEND
        # selects it, and it has to be set anyway: the image is built
        # per backend -- DualMap brings its own checkout and weights --
        # so a manifest that pinned one would be a second place to
        # disagree with the image. Defaults to concept_graphs, which
        # ignores the dualmap block below.
        # DualMap associates by point overlap between consecutive views of an
        # object, and its class vote needs several observations; at 2 s per
        # tick a robot at 0.15 m/s saw most objects once (54 of 57 exported
        # objects had one observation). 1 s doubles that for 0.3 s of GPU per
        # tick, and slam_toolbox no longer contends for the GPU as RTAB-Map's
        # visual odometry did.
        period_s: 1.0
        dualmap:
          keyframe_translation_m: 0.15
          keyframe_rotation_deg: 5.0
          keyframe_time_s: 5.0
          # DualMap needs stable_num observations before a track counts as
          # stable; its default of 8 assumes a dataset replay that maps every
          # frame. A robot mapping keyframes at walking pace sees each object a
          # handful of times, so at 8 the map emptied out behind it (65 tracks
          # -> 1 over one office run). 3 is enough here. The window and the
          # pending count stay at DualMap's defaults: max_pending_count is also
          # how long a STABLE track waits before promotion to the global map,
          # and raising it to 20 stopped promotion altogether (0 promoted in
          # 180 s), which is where the cross-class merge happens.
          stable_num: 3
          # Keep tracks around long enough to be re-observed: with the global
          # map off these two no longer delay anything, they only decide how
          # long an unseen track survives (10 / 5 deleted most objects before
          # the robot came back to them).
          active_window_size: 40
          max_pending_count: 20
          # Association gates point overlap at downsample_voxel_size (2 cm by
          # default, which assumes ground-truth poses). This deployment's SLAM
          # pose is off by 3-7 cm (P95) between keyframes, so at 2 cm two views
          # of one object never overlap and every keyframe started a new track
          # (54 of 57 objects had one observation). 5 cm covers that error.
          downsample_voxel_size: 0.05
          # DualMap's own duplicate merge: two tracks whose point overlap exceeds
          # merge_sim_threshold are joined every merge_every_keyframes. The
          # default 0.9 never fired here (65 -> 65 in the log) for the same
          # reason association failed — pose error — so it is relaxed and run
          # more often. Keeping tracks alive (above) is what makes recall; this
          # is what keeps the duplicates that come with it from piling up.
          merge_sim_threshold: 0.3
          merge_every_keyframes: 10
          # The detector can only answer with a name it was given, and DualMap
          # ships a 101-name list built for homes -- bed, bathtub, ironing
          # board. In an office it called the cabinet a sink and the chair an
          # ironing board; 27 of the 38 objects the benchmark counted as
          # invented sat within a metre of a real one, so they were the right
          # place under the wrong name. This list is deliberately wider than
          # what this world contains, so the score still measures recognition
          # rather than a lookup.
          # An office has no rugs; a track lying on the floor here is depth
          # noise wearing a furniture label.
          floor_gate: true
          classes:
            - chair
            - table
            - desk
            - couch
            - sofa
            - stool
            - bench
            - cabinet
            - bookshelf
            - shelf
            - drawer
            - door
            - window
            - curtain
            - lamp
            - ceiling_light
            - monitor
            - keyboard
            - mouse
            - computer
            - laptop
            - printer
            - telephone
            - potted_plant
            - vase
            - picture
            - whiteboard
            - clock
            - trash_can
            - box
            - book
            - cup
            - bottle
            - sink
            - rug
            - cushion
            - backpack
            - fan
            - radiator
            - mirror
        confidence_threshold: 0.30
        max_detections: 30
primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config: {}
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      width: 640
      height: 480
      fx: 554.0
      fy: 554.0
      cx: 320.0
      cy: 240.0
      sentinel_timeout_s: 150
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      sentinel_timeout_s: 150

service:
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    # Test branch: adds the `localizer` slot (particle filter on the saved grid
    # with global relocalization). Point back at main once it merges.
    # An unmerged branch of the mapping service, not main. Every number this
    # deployment produced was measured against it: it carries the fix for
    # unexplored cells being served to nav2 as free floor
    # (syswonder/service-map-rbnx#24), without which both perception backends
    # score against a wrong world model. Move this to main once it lands.
    branch: feat/map-localizer
    config:
      use_sim_time: true
      # 2D-lidar SLAM instead of RTAB-Map: no visual loop closures to reject,
      # which is what slid the pose graph (and the walls) mid-run.
      algo: slam_toolbox
      # Localization on saved maps: load_map without a pose asks for global
      # localization instead of needing an operator's guess.
      localizer: amcl
      # Match the validated Webots deployment: planar lidar owns persistent
      # structural occupancy; RGB-D remains a registration/loop-closure input.
      occupancy_sources: [lidar]
      # Unchanged from the reference manifest; slam_toolbox ignores these and
      # reads the 2D scan plus the chassis odom -> base_link tf.
      rtabmap_inputs: [lidar, rgbd, odom]
      params_file: config/rtabmap_params.yaml
      sensor_providers:
        lidar2d: tiago_lidar
        rgb: tiago_camera
        depth: tiago_camera
        odom: tiago_chassis

  - name: nav2
    url: https://github.com/syswonder/service-navigation-rbnx
    branch: main
    config:
      params_file: config/nav2_params.yaml
      use_sim_time: true
      action_wait_s: 240.0
      # Keep startup behavior at the controller's existing 0.26 m/s ceiling;
      # runtime speed commands can then adjust it in 20-point increments.
      dynamic_speed:
        max_linear_speed_mps: 0.26
        default_percentage: 100
        step_percentage: 20
        min_percentage: 20
      # The simulation goal checker enters at 0.25 m. Keep the terminal
      # rotation guard inside that boundary so path-alignment turns are not
      # mistaken for a stuck final-yaw correction.
      guard_terminal_xy_m: 0.20
      provider_ids:
        map: mapping
        odom: tiago_chassis
        scan: tiago_lidar

skill:
  # explore_rbnx — autonomous frontier exploration.
  - name: explore
    url: https://github.com/syswonder/skill-explore-rbnx
    branch: main
    config: {}
