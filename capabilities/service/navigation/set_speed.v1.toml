# Change the running navigation controller's speed limit without canceling or
# resubmitting its active goal.
[contract]
id      = "robonix/service/navigation/set_speed"
version = "1"
kind    = "service"
idl     = "navigation/srv/SetNavigationSpeed.srv"
description = "Dynamically make navigation faster or slower within the deployment-owned controller speed limit."

[mode]
type = "rpc"
