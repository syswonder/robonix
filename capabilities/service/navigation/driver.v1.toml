# Legacy namespace-specific lifecycle contract for navigation services.
# Existing manifests remain supported; new packages omit Driver and use the
# shared contract automatically. A package must not declare both contracts.
# `rbnx boot` calls Driver(CMD_INIT, config_json) against this interface
# AFTER all primitives have finished init (services may depend on
# primitive data streams).
[contract]
id      = "robonix/service/navigation/driver"
version = "1"
kind    = "service"
idl     = "lifecycle/srv/Driver.srv"
description = "Legacy-compatible lifecycle interface for navigation service providers."

[mode]
type = "rpc"
