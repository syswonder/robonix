# Voiceprint enrollment (admin).
# Caller (typically `rbnx chat`'s user-management modal) sends a freshly
# captured sample plus the user_id/user_name to bind, service persists
# the embedding. Not invoked from the LLM path — this is purely an
# operator-facing setup RPC.
[contract]
id      = "robonix/service/voiceprint/enroll"
version = "1"
kind    = "service"
idl     = "voiceprint/srv/Enroll.srv"
description = "Enroll a speaker identity from voice samples."

[mode]
type = "rpc"

[semantics]
stateless = false   # mutates persistent enrolled.json
