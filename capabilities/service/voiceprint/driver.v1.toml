# Lifecycle interface for the Voiceprint service.
# `rbnx boot` sends the package instance configuration through
# Driver(CMD_INIT, config_json) before promoting the provider to ACTIVE.
[contract]
id = "robonix/service/voiceprint/driver"
version = "1"
kind = "service"
idl = "lifecycle/srv/Driver.srv"
description = "Lifecycle and per-instance configuration for Voiceprint providers."

[mode]
type = "rpc"
