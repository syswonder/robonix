# Legacy namespace-specific lifecycle contract for Voiceprint services.
# Existing manifests remain supported; new packages omit Driver and use the
# shared contract automatically. A package must not declare both contracts.
# `rbnx boot` sends the package instance configuration through
# Driver(CMD_INIT, config_json) before promoting the provider to ACTIVE.
[contract]
id = "robonix/service/voiceprint/driver"
version = "1"
kind = "service"
idl = "lifecycle/srv/Driver.srv"
description = "Legacy-compatible lifecycle and configuration interface for Voiceprint providers."

[mode]
type = "rpc"
