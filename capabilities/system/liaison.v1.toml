# Unified user-facing entry point. Two RPCs share this contract:
#   * SubmitTask(Task) → stream PilotEvent           — text / API / pre-built Task path
#   * StartVoiceSession(...) → stream VoiceEvent     — voice push-to-talk path
# Voice path is orchestrated end-to-end inside Liaison (mic → ASR → voiceprint
# → Pilot → optional TTS → speaker); clients only render VoiceEvents.
# ROS: `lib/system/liaison/srv/SubmitTask.srv`, `lib/system/liaison/srv/StartVoiceSession.srv`.
[contract]
id      = "robonix/system/liaison"
version = "1"
kind    = "service"
idl     = "liaison/srv/SubmitTask.srv"

[mode]
type = "rpc_server_stream"

[[extra_rpc]]
idl  = "liaison/srv/StartVoiceSession.srv"
type = "rpc_server_stream"
name = "StartVoiceSession"

[semantics]
unified_entry = true
interruptible = true
multimodal    = true
