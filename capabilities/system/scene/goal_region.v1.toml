# Find a navigation-safe pose inside a registered region annotation.
# Returns map-frame (x, y, yaw); pass to navigation/navigate after.
[contract]
id      = "robonix/system/scene/goal_region"
version = "1"
kind    = "service"
idl     = "semantic_map/srv/GoalRegion.srv"
description = "Resolve a region annotation to a navigation-safe pose inside its polygon. Use this for named rooms or regions before navigation/navigate."

[mode]
type = "rpc"
