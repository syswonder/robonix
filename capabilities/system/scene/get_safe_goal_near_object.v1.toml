# Safe-approach goal lookup for a registered scene object.
#
# Why this lives in scene (not navigation): scene already owns the
# semantic registry (object xy/bbox) and consumes service/map/occupancy_grid
# as one of its observation streams. Combining "where is this object" +
# "where's a free cell near it" into a single rpc is the one place that
# minimises round-trips for the LLM:
#
#   LLM:  get_object("chair_004") → has obj.position
#   LLM:  get_safe_goal_near_object("chair_004") → reachable approach pose
#   LLM:  navigation/navigate(pose) → nav drives there with collision
#                                      avoidance + lidar e-stop
#
# The point of having scene compute the goal (not navigation) is that
# scene knows object geometry — bbox + class-specific inflation (you
# approach a `chair` differently from a `wall`). navigation only ever
# sees a free-space xy from this contract; it does not need to know
# anything about the semantic target. Keeps namespaces decoupled.
#
# Returns `reachable=false` instead of throwing when the object is in a
# pocket of unreachable map — caller decides whether to give up or
# try a different target.
[contract]
id      = "robonix/system/scene/get_safe_goal_near_object"
version = "1"
kind    = "system"

[io.srv]
srv = "semantic_map/srv/GetSafeGoalNearObject"

[mode]
type = "rpc"
