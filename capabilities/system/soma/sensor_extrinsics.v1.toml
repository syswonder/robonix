# Static mount transforms for every sensor declared in the URDF.
# Replaces the per-primitive `primitive/<area>/extrinsics` pattern —
# soma owns the kinematic chain, primitives just publish data
# streams. scene's camera-to-world projection consumes this to skip
# the tf2 side-channel entirely; multi-camera fusion does the same.
#
# Optional `sensor_kind` filter ("camera" / "lidar" / "imu" / "" = all).
[contract]
id      = "robonix/system/soma/sensor_extrinsics"
version = "1"
kind    = "system"

[io.srv]
srv = "soma/srv/GetSensorExtrinsics"

[mode]
type = "rpc"
