# Lifecycle interface every camera primitive implementation MUST declare.
# `rbnx boot` calls Driver(CMD_INIT, config_json) against this interface
# right after RegisterCapability and waits for ok=true before moving on.
[contract]
id      = "robonix/primitive/camera/driver"
version = "1"
kind    = "primitive"
idl     = "lifecycle/srv/Driver.srv"
description = "Lifecycle control interface for camera primitive providers."

[mode]
type = "rpc"
