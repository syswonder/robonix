# Static camera-mount extrinsics. The camera primitive declares this
# as a compatibility source for consumers that cannot resolve the
# selected camera frame through tf2. Scene treats the complete TF tree
# as authoritative and uses this contract only when that lookup is unavailable.
#
# Why the compatibility contract remains:
#   Older deployments may not expose a complete TF chain to Scene. Routing a
#   reviewed fallback through atlas keeps that dependency visible in `rbnx
#   caps` / `rbnx channels`, while avoiding a second source of truth whenever
#   TF already resolves the selected optical frame.
#
# Payload: geometry_msgs/TransformStamped — `header.frame_id` is the
# parent (typically the chassis base link, e.g. `base_link`),
# `child_frame_id` is the camera's optical frame (e.g.
# `head_front_camera_rgb_optical_frame` on Tiago,
# `camera_color_optical_frame` on a typical RealSense). The transform
# is `parent ← child` in the standard ROS sense (i.e. it expresses the
# child's pose in the parent's frame, equivalently the matrix that
# maps points in the child frame into the parent frame).
#
# Cadence: TRANSIENT_LOCAL + RELIABLE (latched). Camera mount is
# static within a deployment; publishers should send once at startup
# and on any re-calibration event. Late subscribers (scene started
# after camera) are guaranteed to receive the cached value.
[contract]
id      = "robonix/primitive/camera/extrinsics"
version = "1"
kind    = "primitive"
idl     = "common_interfaces/geometry_msgs/msg/TransformStamped.msg"
description = "Compatibility static transform from the robot body frame to the camera optical frame when TF is unavailable."

[mode]
type = "topic_out"
