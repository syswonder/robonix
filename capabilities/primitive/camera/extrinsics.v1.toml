# Static camera-mount extrinsics. The camera primitive declares this
# so downstream consumers (scene's camera-to-world projection, any
# arm-IK that needs eye-in-hand calibration, multi-camera fusion) can
# compose `world ← base ← camera_optical` without going through tf2.
#
# Why this is a contract and not a tf2 lookup:
#   tf2 is a global ROS side-channel — atlas can't see it, `rbnx caps`
#   can't list it, `rbnx channels` can't audit it. Deployments with
#   different camera mount geometries need different extrinsics, and
#   routing the value through atlas means
#   the consumer asks for `primitive/camera/extrinsics` and gets the
#   right transform regardless of which robot is wired in. tf2 stays
#   available for raw ROS tooling (rviz, ros2 echo) but is not on the
#   critical path of any robonix capability resolution.
#
# Payload: geometry_msgs/TransformStamped — `header.frame_id` is the
# parent robot body frame, and `child_frame_id` is the active camera's
# optical frame. The transform
# is `parent ← child` in the standard ROS sense (i.e. it expresses the
# child's pose in the parent's frame, equivalently the matrix that
# maps points in the child frame into the parent frame).
#
# Cadence: TRANSIENT_LOCAL + RELIABLE (latched). Camera mount is
# static within a deployment; publishers should send once at startup
# and on any re-calibration event. Late subscribers (scene started
# after camera) are guaranteed to receive the cached value.
[contract]
id      = "robonix/primitive/camera/extrinsics"
version = "1"
kind    = "primitive"
idl     = "common_interfaces/geometry_msgs/msg/TransformStamped.msg"
description = "Static transform from the robot body frame to the camera optical frame."

[mode]
type = "topic_out"
