# Generic control passthrough: execute arbitrary drone actions (dynamic extension entry point).
# Usage: call list_capabilities to query available actions, then invoke this primitive with action + JSON params.
[contract]
id      = "robonix/primitive/drone/invoke"
version = "1"
kind    = "primitive"
idl     = "drone/srv/Invoke.srv"
description = "Generic control passthrough: execute an arbitrary drone action. Call list_capabilities first to query available actions and their parameters; new controls can be called through this primitive without changing the contract."

[mode]
type = "rpc"
