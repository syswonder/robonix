# Set speed limit per joint (0-1).  Request includes joint_names alongside
# limits so the driver can validate joint order (mirrors move_joint convention).
# NOT exposed as MCP — LLM should not tune motor parameters directly;
# skill/service set these in task context.
[contract]
id      = "robonix/primitive/hand/set_speed_limits"
version = "1"
kind    = "primitive"
idl     = "hand/srv/SetSpeedLimits.srv"

[mode]
type = "rpc"
