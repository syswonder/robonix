# Continuous ROS 2 topic stream of current per-axis positions. Publishes
# JointState (JointValue[] joints; value = current normalized position [0,1])
# at driver-native rate. Each entry carries its axis `name`, so the stream is
# self-describing -- the axis-level counterpart to state_finger.
[contract]
id      = "robonix/primitive/hand/state_joint"
version = "1"
kind    = "primitive"
idl     = "hand/msg/JointState.msg"

[mode]
type = "topic_out"
