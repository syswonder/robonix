# Legacy namespace-specific lifecycle contract for chassis providers. Existing
# manifests remain supported; new packages omit Driver and use shared automatically.
# A package must not declare both lifecycle contracts.
# `rbnx boot` calls Driver(CMD_INIT, config_json) against this interface
# right after RegisterCapability and waits for ok=true before moving on.
[contract]
id      = "robonix/primitive/chassis/driver"
version = "1"
kind    = "primitive"
idl     = "lifecycle/srv/Driver.srv"
description = "Legacy-compatible lifecycle interface for chassis primitive providers."

[mode]
type = "rpc"
