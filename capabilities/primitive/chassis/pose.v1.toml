# nav_msgs/PoseWithCovarianceStamped stream — typically AMCL's
# /amcl_pose. The chassis primitive declares this when it knows
# which topic carries its localised pose.
[contract]
id      = "robonix/primitive/chassis/pose"
version = "1"
kind    = "primitive"

[io.msg]
msg = "geometry_msgs/msg/PoseWithCovarianceStamped"

[mode]
type = "topic_out"
