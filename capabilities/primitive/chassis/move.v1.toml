# Single-shot motion command. Driver publishes the inner Twist on the
# robot's cmd_vel topic for a brief duration (driver-specific) then
# stops. Returns a `std_msgs/String` ack with status JSON. NOT a stream
# — the LLM drives motion as discrete bursts (snapshot → reason → move
# → snapshot), not as a continuous client-stream.
[contract]
id      = "robonix/primitive/chassis/move"
version = "1"
kind    = "primitive"
idl     = "primitive/chassis/srv/ExecuteMoveCommand.srv"

[mode]
type = "rpc"
