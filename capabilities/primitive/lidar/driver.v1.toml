# Legacy namespace-specific lifecycle contract for lidar providers. Existing
# manifests remain supported; new packages omit Driver and use shared automatically.
# A package must not declare both lifecycle contracts.
[contract]
id      = "robonix/primitive/lidar/driver"
version = "1"
kind    = "primitive"
idl     = "lifecycle/srv/Driver.srv"
description = "Legacy-compatible lifecycle interface for lidar primitive providers."

[mode]
type = "rpc"
