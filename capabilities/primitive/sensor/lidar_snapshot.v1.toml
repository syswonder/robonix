# On-demand lidar scan snapshot (single scan).
# Complements robonix/primitive/sensor/lidar (continuous stream).
# ROS IDL: `lib/primitive/sensor/srv/GetLaserScan.srv`.
[contract]
id      = "robonix/primitive/sensor/lidar_snapshot"
version = "1"
kind    = "primitive"

[io.srv]
srv = "sensor/srv/GetLaserScan"

[mode]
type = "rpc"
