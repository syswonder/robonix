# Namespace-specific lifecycle contract for GNSS providers that deploy against
# the namespace Driver API. New packages omit Driver and use the shared
# lifecycle automatically. A package must not declare both lifecycle contracts.
[contract]
id      = "robonix/primitive/gnss/driver"
version = "1"
kind    = "primitive"
idl     = "lifecycle/srv/Driver.srv"
description = "Explicit lifecycle compatibility with the namespace-driver SDK for GNSS primitive providers."

[mode]
type = "rpc"
