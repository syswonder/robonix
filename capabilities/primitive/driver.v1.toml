# Lifecycle interface every primitive capability MUST declare. ONE TOML
# for ALL primitives (chassis, camera, lidar, imu, audio, …); at runtime
# each cap declares its driver under its own per-area contract id —
# the `{CAP_CLASS}` placeholder below is filled from the cap's
# namespace leaf at DeclareInterface time:
#   camera primitive  → robonix/primitive/camera/driver
#   base   primitive  → robonix/primitive/base/driver
#   sensor primitive  → robonix/primitive/sensor/driver
# Each cap binds its own endpoint at DeclareInterface time; rbnx start
# drives `Driver(CMD_INIT, config_json=…)` against each cap before the
# cap lazy-declares its real interfaces. See `lib/lifecycle/srv/Driver.srv`
# for command discriminator (INIT / RESET / SHUTDOWN / PROBE) and the
# (ok, state, error) response shape.
#
# `config_json` is an opaque passthrough — the deploy manifest's
# primitive entry's `config:` block, JSON-encoded. Robonix does not
# inspect it; the driver package parses it however it needs.
#
# Codegen note: the `{CAP_CLASS}` placeholder marks this as a TEMPLATE
# contract — codegen does NOT emit a per-contract service stub for it.
# Runtime gRPC calls go through the shared `robonix.lifecycle.Driver`
# stub (generated from the IDL above) regardless of which area the cap
# is in; pilot/executor pick the endpoint by the per-area contract id
# they got from atlas.
[contract]
id      = "robonix/primitive/{CAP_CLASS}/driver"
version = "1"
kind    = "primitive"

[io.srv]
srv = "lifecycle/srv/Driver"

[mode]
type = "rpc"
