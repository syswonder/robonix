# Robonix CI — fmt, clippy, build, tests (unit + system)
name: CI

on:
  push:
    branches: [main, dev, dev-next, dev/**]
  pull_request:
    branches: [main, dev, dev-next, dev/**]

# Least privilege: every job here only reads the checked-out tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-portability:
    name: Generic runtime portability audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject deployment-specific core fallbacks
        run: python3 scripts/check_runtime_portability.py

  webots-streaming-smoke:
    name: Webots streaming smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install streaming test dependency
        run: python3 -m pip install "websockets>=14,<17"
      - name: Test custom ports and helper readiness
        run: python3 examples/webots/sim/tests/test_streaming.py
      - name: Test Webots report infrastructure failures
        run: python3 -m unittest discover -s testing -p 'test_*.py' -v

  check:
    name: Rust (fmt + clippy + build + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (lib + bins + tests)
        run: cargo clippy --workspace --tests -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # Unit tests: per-crate #[cfg(test)] mods (atlas registry, pilot helpers, …).
      # System tests: robonix-atlas/tests/end_to_end.rs spawns Atlas on an
      # ephemeral port and drives it through the SDK — exercises RegisterNode /
      # DeclareInterface / QueryNodes / NegotiateChannel end-to-end.
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

      - name: Webots LaserScan normalization regression
        run: python3 examples/webots/primitives/tiago_lidar/tests/test_scan_normalize.py
