# Robonix CI — fmt, clippy, build, tests (unit + system)
name: CI

on:
  push:
    branches: [main, dev, dev-ci-test, dev-next, dev/**]
  pull_request:
    branches: [main, dev, dev-next, dev/**]

# Least privilege: every job here only reads the checked-out tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-portability:
    name: Generic runtime portability audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject deployment-specific core fallbacks
        run: python3 scripts/check_runtime_portability.py

  webots-streaming-smoke:
    name: Webots streaming smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python3 -m pip install "websockets>=14,<17" "PyYAML>=6,<7"
      - name: Test custom ports and helper readiness
        run: python3 examples/webots/sim/tests/test_streaming.py
      - name: Test Webots report infrastructure failures
        run: python3 -m unittest discover -s testing -p 'test_*.py' -v

  scene-vlm-cache:
    name: Scene VLM inference cache tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused Scene test dependencies
        run: >-
          python3 -m pip install pytest "numpy>=1.26,<2" "scipy>=1.11"
          httpx Pillow regex starlette uvicorn ./pylib/robonix-api
      - name: Test Scene logic that needs no service stack
        run: >-
          python3 -m pytest -q
          system/scene/tests/test_scene_graph.py
          system/scene/tests/test_vlm_inference_cache.py
          system/scene/tests/test_perception_vlm_geometry.py
          system/scene/tests/test_image_relations.py
          system/scene/tests/test_annotations.py
          system/scene/tests/test_identity.py
          system/scene/tests/test_perception_dualmap.py
          system/scene/tests/test_perception_concept_graphs.py
          system/scene/tests/test_perception_engines.py::test_yolo_nms_keeps_only_the_best_class_per_anchor

      - name: Test Scene map save and load facade
        env:
          PYTHONPATH: system/scene
        run: |
          python3 -c 'import scene_service.web'
          python3 -m pytest -q system/scene/tests/test_map_epoch.py system/scene/tests/test_map_binding.py system/scene/tests/test_map_operation_ui.py testing/test_capture_nav_diagnostics.py

      # The goal planner and the message-shape rule are pure and import neither
      # robonix_api nor the generated MCP types, so they run under the same
      # lightweight dependency set. Without them here nothing on a pull request
      # exercises the guards against a malformed occupancy grid, which is how
      # those guards came to be missing in the first place.
      - name: Test Scene goal planning and upstream message validation
        run: >-
          python3 -m pytest -q
          system/scene/tests/test_goal_planner.py
          system/scene/tests/test_malformed_grid_inputs.py

  robonix-api-tests:
    name: robonix-api unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installs the package the way a consumer gets it, so an import the
      # tests rely on cannot pass by accident through PYTHONPATH alone.
      - name: Install robonix-api
        run: python3 -m pip install ./pylib/robonix-api
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Test robonix-api
        run: python3 -m pytest -q pylib/robonix-api/tests

  chronos-python:
    name: Chronos Python bindings
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check Rust bindings
        run: cargo clippy --locked -p robonix-chronos-clock --features python --all-targets -- -D warnings
      - name: Test Rust bindings
        run: cargo test --locked -p robonix-chronos-clock --features python
      - name: Build and install wheel
        run: |
          python -m pip install 'maturin>=1.12,<2'
          maturin build --locked --release --manifest-path system/chronos/clock/Cargo.toml --out "$RUNNER_TEMP/chronos-wheels"
          python -m pip install "$RUNNER_TEMP"/chronos-wheels/*.whl
      - name: Test Python bindings
        run: python -m unittest discover -s system/chronos/clock/tests -p test_python.py

  check:
    name: Rust (fmt + clippy + build + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (lib + bins + tests)
        run: cargo clippy --workspace --tests -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # Unit tests: per-crate #[cfg(test)] mods (atlas registry, pilot helpers, …).
      # System tests: robonix-atlas/tests/end_to_end.rs spawns Atlas on an
      # ephemeral port and drives it through the SDK — exercises RegisterNode /
      # DeclareInterface / QueryNodes / NegotiateChannel end-to-end.
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

      - name: Webots LaserScan normalization regression
        run: python3 examples/webots/primitives/tiago_lidar/tests/test_scan_normalize.py
