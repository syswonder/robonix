# Robonix CI — fmt, clippy, build, tests (unit + system)
name: CI

on:
  push:
    branches: [main, dev, dev/**]
  pull_request:
    branches: [main, dev, dev/**]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust (fmt + clippy + build + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: IDL comment contract identifiers
        run: python3 testing/test_contract_idl_comments.py

      - name: Python API discovery helpers
        run: python3 testing/test_robonix_api_discovery.py

      - name: cargo clippy (lib + bins + tests)
        run: cargo clippy --workspace --tests -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # Unit tests: per-crate #[cfg(test)] mods (atlas registry, pilot helpers, …).
      # System tests: robonix-atlas/tests/end_to_end.rs spawns Atlas on an
      # ephemeral port and drives it through the SDK — exercises RegisterNode /
      # DeclareInterface / QueryNodes / NegotiateChannel end-to-end.
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

      - name: Webots LaserScan normalization regression
        run: python3 examples/webots/primitives/tiago_lidar/tests/test_scan_normalize.py
