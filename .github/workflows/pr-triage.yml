name: PR triage

# Labels PRs by touched path (component labels via .github/labeler.yml) and by
# the Conventional-Commits type in the PR title. Reviewer auto-request is
# handled natively by .github/CODEOWNERS, not here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  component-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

  type-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            // Conventional Commits: <type>(scope)!: subject
            const m = title.match(/^(\w+)(\([^)]*\))?!?:/);
            const type = m ? m[1].toLowerCase() : "";
            const map = {
              feat: "type:feature",
              fix: "type:bug",
              docs: "type:docs",
              refactor: "type:refactor",
              perf: "type:perf",
              test: "type:test",
              chore: "type:chore",
              build: "type:chore",
              ci: "type:chore",
            };
            const label = map[type];
            if (!label) {
              core.info(`No type label for title prefix: "${title}"`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
            core.info(`Added ${label}`);
