name: Test Robonix

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'rust/**'
      - '.github/workflows/test-rust-robonix.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'rust/**'
      - '.github/workflows/test-rust-robonix.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/enkerewpo/robonix_ros:latest
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Source ROS2 environment
        run: |
          source /opt/ros/humble/setup.bash
          echo "source /opt/ros/humble/setup.bash" >> ~/.bashrc

      - name: Build robonix-cli
        working-directory: rust/robonix-cli
        run: |
          source /opt/ros/humble/setup.bash
          cargo build --release

      - name: Setup robonix packages directory
        working-directory: rust
        run: |
          mkdir -p ~/.robonix
          rm -rf ~/.robonix/packages
          ln -s "$(realpath provider/)" ~/.robonix/packages
          echo "FASTRTPS_DEFAULT_PROFILES_FILE=" >> $GITHUB_ENV

      - name: Build robonix-msg
        working-directory: rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          chmod +x build_ros2.sh
          ./build_ros2.sh

      - name: Set up environment variables
        run: |
          echo "ROBONIX_MSG_PATH=$(realpath rust/robonix-msg)" >> $GITHUB_ENV
          echo "FASTRTPS_DEFAULT_PROFILES_FILE=" >> $GITHUB_ENV

      - name: Start robonix-core in background
        working-directory: rust/robonix-core
        run: |
          source /opt/ros/humble/setup.bash
          source ${{ github.workspace }}/rust/robonix-msg/install/setup.bash
          export ROBONIX_MSG_PATH="${{ github.workspace }}/rust/robonix-msg"
          export FASTRTPS_DEFAULT_PROFILES_FILE=
          cargo build --release
          nohup cargo run --release --bin robonix-core > /tmp/robonix-core.log 2>&1 &
          echo $! > /tmp/robonix-core.pid
          sleep 5  # Wait for robonix-core to start

      - name: Verify robonix-core is running
        env:
          ROBONIX_MSG_PATH: ${{ github.workspace }}/rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          source $ROBONIX_MSG_PATH/install/setup.bash
          # Check if robonix-core services are available
          timeout 30 bash -c 'until ros2 service list | grep -q "/rbnx/prm/register"; do sleep 1; done' || (cat /tmp/robonix-core.log && exit 1)
          echo "robonix-core services are available"

      - name: Configure robonix-cli
        working-directory: rust/robonix-cli
        env:
          ROBONIX_MSG_PATH: ${{ github.workspace }}/rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          source $ROBONIX_MSG_PATH/install/setup.bash
          cargo run --release -- config --set-msg-path ../robonix-msg
          cargo run --release -- config -s

      - name: Build packages
        working-directory: rust/robonix-cli
        env:
          ROBONIX_MSG_PATH: ${{ github.workspace }}/rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          source $ROBONIX_MSG_PATH/install/setup.bash
          cargo run --release -- package build all

      - name: Register packages using recipe
        working-directory: rust/robonix-cli
        env:
          ROBONIX_MSG_PATH: ${{ github.workspace }}/rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          source $ROBONIX_MSG_PATH/install/setup.bash
          cargo run --release -- deploy register demo_recipe.yaml

      - name: Verify registered primitives, services, and skills
        env:
          ROBONIX_MSG_PATH: ${{ github.workspace }}/rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          source $ROBONIX_MSG_PATH/install/setup.bash
          # Check if services are available
          ros2 service type /rbnx/prm/register
          ros2 service type /rbnx/prm/query
          ros2 service type /rbnx/srv/register
          ros2 service type /rbnx/srv/query
          ros2 service type /rbnx/skl/register
          ros2 service type /rbnx/skl/query
          ros2 service type /rbnx/task/submit
          ros2 service type /rbnx/task/status
          ros2 service type /rbnx/task/result

      - name: Test task creation
        working-directory: rust/robonix-cli
        env:
          ROBONIX_MSG_PATH: ${{ github.workspace }}/rust/robonix-msg
        run: |
          source /opt/ros/humble/setup.bash
          source $ROBONIX_MSG_PATH/install/setup.bash
          # Create a test task
          cargo run --release -- task create "Test task for CI"
          # Wait a bit for task to be processed
          sleep 2
          # Query task status (using task_0 as default first task ID)
          cargo run --release -- task get task_0 || echo "Task query completed (task may not exist yet)"

      - name: Check robonix-core logs
        if: failure()
        run: |
          echo "=== robonix-core logs ==="
          cat /tmp/robonix-core.log || echo "No robonix-core log found"

      - name: Stop robonix-core
        if: always()
        run: |
          if [ -f /tmp/robonix-core.pid ]; then
            kill $(cat /tmp/robonix-core.pid) || true
            sleep 2
            pkill -9 -f robonix-core || true
          fi

