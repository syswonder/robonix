# Scene MCP server — current-state semantic + geometric map of the
# robot's environment. Exposes 6 read-only MCP tools for Pilot.
#
# Deployment shape: scene runs in its OWN docker container (image
# `robonix-scene`, built by scripts/build.sh). Joins host network so:
#   - it can reach atlas at 127.0.0.1:50051
#   - it shares the host DDS bus with whatever sim/robot container
#     is publishing the camera, lidar, pose, and map topics declared through atlas.
#
# Runtime config: scene's ingest layer reads `config.observations[]`
# (passed through shared Driver(CMD_INIT) by `rbnx boot`) to know which ROS2
# topics to subscribe to. Each entry pairs a logical kind ("rgb",
# "depth", "lidar2d", "pose", "odom") with a topic name and ROS msg
# class.
manifestVersion: 1

package:
  name: com.robonix.system.scene
  version: 0.1.0
  vendor: robonix
  description: Scene — semantic + geometric live map of the environment.
  license: MulanPSL-2.0

# Atlas provider_id (matched verbatim by rbnx-boot). Same value as package.name
# here because scene's deployment identity and runtime cap line up; the
# explicit declaration removes any ambiguity for the wait-for-cap loop.

build: bash scripts/build.sh
start: bash scripts/start.sh

stop: docker rm -f "${ROBONIX_SCENE_CONTAINER:-robonix_scene}"

capabilities:
  - name: robonix/system/scene/list_objects
  - name: robonix/system/scene/get_robot_context
  - name: robonix/system/scene/goal_near
  - name: robonix/system/scene/goal_room
  - name: robonix/system/scene/get_scene_graph
  - name: robonix/system/scene/get_object_context
  - name: robonix/system/scene/list_relations
