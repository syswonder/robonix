<style>
#outdoor-app{display:flex;flex-direction:column;height:calc(100vh - 40px);min-height:600px;padding:16px 20px;box-sizing:border-box;gap:12px;color:#e7ebf1;font:13px/1.6 system-ui}
#outdoor-app a{color:#aac7f8}#outdoor-app h1{font-size:21px;margin:0}#outdoor-app h2{font-size:16px;margin:0 0 12px}#outdoor-app h3{font-size:13px;margin:16px 0 8px}
#outdoor-app button,#outdoor-app input{font:inherit}#outdoor-app button{cursor:pointer;border:1px solid #364253;background:#202733;color:inherit;border-radius:6px;padding:7px 11px}#outdoor-app button:hover{border-color:#86aef6}#outdoor-app button:disabled{opacity:.4;cursor:default}#outdoor-app button.primary{background:#739fe9;color:#101827;font-weight:650}
#outdoor-app .od-tabs{display:flex;gap:4px}#outdoor-app .od-tabs .active{background:#34425b}#outdoor-app .od-top{display:flex;justify-content:space-between;align-items:center}#outdoor-app .od-note{font-size:12px;color:#a4b2c7}
#outdoor-app .od-content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}#outdoor-app .od-map{position:relative;overflow:hidden;border:1px solid #2d3645;background:#151b24;border-radius:8px;min-height:360px}#outdoor-app svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#outdoor-app .od-panel{background:#191f29;border:1px solid #2d3645;border-radius:8px;padding:16px;overflow:auto}#outdoor-app .od-panel p{color:#aebacd;margin:8px 0 12px}#outdoor-app .od-panel small{color:#aebacd;font-size:12px}
#outdoor-app .od-row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}#outdoor-app .od-row button{flex:1}#outdoor-app .od-wide{width:100%;margin:6px 0}#outdoor-app .od-fields{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px}#outdoor-app .od-fields span:nth-child(odd){color:#9caac0}
#outdoor-app .od-box{overflow-wrap:anywhere;background:#252c38;border:1px solid #3b4657;padding:10px;border-radius:6px;margin:10px 0;font-size:12px}#outdoor-app .od-warning{border-color:#785f34;color:#e1bc77}#outdoor-app .od-panel input[type=text]{width:100%;box-sizing:border-box;background:#141b25;border:1px solid #44536a;border-radius:5px;color:#dde8f7;padding:8px}
#outdoor-app .od-panel label{display:block;margin:7px 0}#outdoor-app .od-panel input[type=checkbox]{accent-color:#83aef2}#outdoor-app .od-rule{border-top:1px solid #303a49;margin:15px 0}#outdoor-app .od-road{fill:none;stroke:#75a0c3;stroke-linejoin:round;stroke-linecap:round}#outdoor-app .od-hit{fill:none;stroke:transparent;cursor:pointer}

#outdoor-app .od-controls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}#outdoor-app .od-controls button{width:32px;padding:3px}#outdoor-app .od-alert{padding:8px 12px;border:1px solid #7d6638;color:#e5c98f;background:#30291e;border-radius:5px;font-size:12px;white-space:pre-wrap}#outdoor-app .od-alert[hidden]{display:none}
@media(max-width:900px){#outdoor-app{padding:10px}#outdoor-app .od-content{grid-template-columns:minmax(0,1fr) 240px;gap:8px}}@media(max-width:650px){#outdoor-app{height:auto}#outdoor-app .od-content{display:flex;flex-direction:column}#outdoor-app .od-map{height:420px}}
</style>
<section id="outdoor-app">
  <div class="od-top"><h1 data-i18n="outdoor.title">Outdoor map</h1><a href="/maps?map_type=outdoor" data-i18n="outdoor.library">Map library</a></div>
  <div class="od-note" id="od-status"></div><div class="od-alert" id="od-error" hidden role="status"></div>
  <div class="od-tabs" role="tablist"><button data-mode="view" data-i18n="outdoor.view">View</button><button data-mode="capture" data-i18n="outdoor.capture">Capture</button><button data-mode="merge" data-i18n="outdoor.merge">Merge</button><button data-mode="plan" data-i18n="outdoor.plan">Plan</button></div>
  <div class="od-content"><div class="od-map"><svg id="od-svg" viewBox="-10 -10 20 20" aria-label="Outdoor route map"><g id="od-quality"></g><g id="od-roads"></g><g id="od-draft"></g><g id="od-regions"></g><g id="od-route"></g><g id="od-markers"></g><g id="od-conflicts"></g><g id="od-hits"></g><g id="od-joins"></g></svg><div class="od-controls"><button data-command="zoom-in">＋</button><button data-command="zoom-out">－</button><button data-command="fit">⛶</button></div><div class="od-legend"><span><i></i><b data-i18n="outdoor.flat">Flat</b></span><span><i style="border-color:#bb9fe9"></i><b data-i18n="outdoor.stairs">Stairs</b></span><span><i style="border-color:#e5b45e;border-top-style:dashed"></i><b data-i18n="outdoor.low">Lower accuracy</b></span><span><i style="border-color:#8b95a4"></i><b data-i18n="outdoor.unknown">Unknown</b></span></div></div><aside class="od-panel" id="od-panel"></aside></div>
  <div class="od-note" data-i18n="outdoor.reference">Position marks the GNSS antenna; heading is unavailable.</div>
</section>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const root=document.getElementById('outdoor-app'), $=s=>root.querySelector(s), svg=$('#od-svg'), panel=$('#od-panel');
 const tr=k=>t('outdoor.'+k), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let state=null,mode='view',selected=null,merge=null,decisions={},choices={},goal=null,start=null,selectStart=false,route=null,saved=null,view=[-10,-10,20,20],fitted=false,showGait=true,showQuality=true,busy=false,drawKind=null,vertices=[];
 const button=(cmd,label,disabled=false)=>`<button data-command="${cmd}" ${disabled?'disabled':''}>${esc(tr(label))}</button>`;
 const field=(key,value)=>`<span>${esc(tr(key))}</span><span>${esc(value)}</span>`;
 const line=p=>'M'+p.map(q=>`${q.x} ${-q.y}`).join(' L');
 function error(message){$('#od-error').textContent=message||'';$('#od-error').hidden=!message}
 async function request(path,body){const response=await fetch(path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok||result.ok===false)throw Error(result.detail||result.error||response.statusText);return result}
 const snapshot=()=>state?.map?.ok?state.map:null;
 const roads=()=>snapshot()?.network.roads||[];
 function fit(){const points=[...roads().flatMap(r=>r.points),...(state?.draft?.network?.roads||[]).flatMap(r=>r.points),...(state?.status.live_track||[])];if(!points.length)return;const xs=points.map(p=>p.x),ys=points.map(p=>-p.y),w=Math.max(10,Math.max(...xs)-Math.min(...xs)),h=Math.max(10,Math.max(...ys)-Math.min(...ys)),ratio=svg.clientWidth/Math.max(1,svg.clientHeight),width=Math.max(w,h*ratio)*1.3;view=[(Math.min(...xs)+Math.max(...xs))/2-width/2,(Math.min(...ys)+Math.max(...ys))/2-width/ratio/2,width,width/ratio];fitted=true;draw()}
 function section(points,start,end){
  const result=[];let offset=0;
  for(let i=1;i<points.length;i++){
   const a=points[i-1],b=points[i],length=Math.hypot(b.x-a.x,b.y-a.y),lo=Math.max(start,offset),hi=Math.min(end,offset+length);
   if(length&&lo<=hi){for(const at of [lo,hi]){const t=(at-offset)/length;result.push({x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)})}}
   offset+=length;
  }
  return result;
 }
 function draw(){svg.setAttribute('viewBox',view.join(' '));const stroke=view[2]/300, dot=stroke*2;
  $('#od-roads').innerHTML=roads().map(r=>`<path class="od-road" d="${line(r.points)}" stroke-width="${stroke}" style="stroke:${showGait?({stairs:'#bb9fe9',flat:'#75a0c3'}[r.gait]||'#8b95a4'):'#75a0c3'}"/>`).join('');
  $('#od-quality').innerHTML=showQuality?roads().filter(r=>r.low_accuracy).map(r=>`<path d="${line(r.points)}" fill="none" stroke="#e5b45e" stroke-width="${stroke*2}" stroke-dasharray="${stroke} ${stroke*2}"/>`).join(''):'';
  const draft=state?.draft?.network?.roads||[];let live=state?.status.live_track||[];let livePaths=[];for(const p of live){if(!livePaths.length||livePaths.at(-1).at(-1).segment!==p.segment)livePaths.push([]);livePaths.at(-1).push(p)}
  $('#od-draft').innerHTML=(mode==='capture'||mode==='merge'?[...draft.map(r=>r.points),...livePaths].map(p=>`<path d="${line(p)}" fill="none" stroke="#72dec7" stroke-width="${stroke}" stroke-dasharray="${stroke*2} ${stroke*2}"/>`).join(''):'');
  $('#od-hits').innerHTML=roads().map((r,i)=>`<path class="od-hit" data-road="${i}" d="${line(r.points)}" stroke-width="${stroke*6}"/>`).join('');
  $('#od-joins').innerHTML=mode==='merge'&&merge?merge.candidates.map((c,i)=>`<circle data-join="${esc(c.id)}" cx="${c.point_a.x}" cy="${-c.point_a.y}" r="${dot*1.5}" fill="${decisions[c.id]==='connect'?'#628f78':'#9b7941'}" stroke="#e9c37c" stroke-width="${stroke/3}"><title>${esc(tr('connection'))} ${i+1}</title></circle>`).join(''):'';
  $('#od-conflicts').innerHTML=mode==='merge'&&merge?merge.conflicts.map(c=>{
   const r=merge.network.roads.find(r=>r.id===c.old_road),points=section(r.points,c.start_m,c.end_m);
   return `<path d="${line(points)}" fill="none" stroke="${c.gait_conflict?'#ed947f':'#e5b45e'}" stroke-width="${stroke*2}" stroke-dasharray="${stroke} ${stroke}" pointer-events="none"/>`;
  }).join(''):'';
  $('#od-route').innerHTML=route?`<path d="${line(route.reference_path)}" fill="none" stroke="#e8f2ff" stroke-width="${stroke/2}" stroke-dasharray="${stroke*2} ${stroke}"/>`:'';
  const pose=state?.is_active?state.status.pose:null, markers=[];
  if(pose)markers.push(`<circle cx="${pose.x}" cy="${-pose.y}" r="${dot}" fill="#87aff5" stroke="#d4e3ff" stroke-width="${stroke/2}"/>`);
  for(const [p,color]of[[goal,'#c2ead8'],[start,'#84a9ee']])if(p)markers.push(`<circle cx="${p.x}" cy="${-p.y}" r="${dot}" fill="${color}"/>`);
  if(vertices.length)markers.push(`<path d="${line(vertices)}" fill="none" stroke="#eed18e" stroke-width="${stroke/2}"/>`);
  $('#od-markers').innerHTML=markers.join('');
  $('#od-regions').innerHTML=(state?.annotations||[]).map(a=>a.kind==='region'?`<polygon points="${a.points.map(p=>p[0]+','+-p[1]).join(' ')}" fill="#7ba5e426" stroke="${a.stale?'#dfba69':'#769bce'}" stroke-width="${stroke/3}"><title>${esc(a.name)}</title></polygon>`:`<circle cx="${a.points[0][0]}" cy="${-a.points[0][1]}" r="${dot}" fill="#d9c290"><title>${esc(a.name)}</title></circle>`).join('');
 }
 function renderView(s,session,recording,map){const r=roads().find(r=>r.id===selected);return `<h2>${esc(tr('view'))}</h2><p>${esc(state.is_active?tr('chooseRoad'):map?tr('different'):tr('noMap'))}</p>${r?`<div class="od-fields">${field('length',r.length_m.toFixed(1)+' '+tr('meters'))}${field('gait',tr(r.gait))}${field('grade',tr(r.grade))}${field('direction',tr('both'))}${field('source',r.sources.join(', '))}</div>`:''}
<div class="od-rule"></div><label><input type="checkbox" id="od-gait" ${showGait?'checked':''}> ${esc(tr('gaitLayer'))}</label><label><input type="checkbox" id="od-quality-toggle" ${showQuality?'checked':''}> ${esc(tr('qualityLayer'))}</label><p>${esc(tr('lowHint'))}</p>
<h3>${esc(tr('annotations'))}</h3><div class="od-row">${button('mark-region','markRegion',!state.is_active)}${button('mark-poi','markPoi',!state.is_active)}</div><a href="/regions?map_type=outdoor">${esc(tr('editRegions'))}</a>${drawKind?`<p>${esc(tr(drawKind==='region'?'regionHint':'poiHint'))}</p>${button('cancel-draw','cancel')}`:''}`;}
 function renderCapture(s,session,recording,map){return `<h2>${esc(tr('capture'))}</h2><div class="od-fields">${field('session',tr(session.state||'idle'))}${field('points',s.point_count||0)}${field('grade',tr(s.position_grade||'unknown'))}${field('receiverQuality',s.receiver_quality??'—')}${field('gait',tr(s.gait||'unknown')+(s.gait_code==null?'':' · 0x'+Number(s.gait_code).toString(16)))}</div>${!s.position_valid?`<div class="od-box od-warning">${esc(tr('invalidPosition'))}</div>`:''}${session.error?`<div class="od-box od-warning">${esc(session.error)}</div>`:''}
<h3>${esc(tr('ready'))}</h3>${['fix','rtk_status','gait'].map(k=>`<div class="od-fields"><span>${esc(k)}</span><span>${esc(tr(s.inputs?.[k]?.fresh?'fresh':'stale'))}</span></div>`).join('')}
<div class="od-rule"></div>${recording?`<div class="od-row">${button(session.state==='paused'?'resume':'pause',session.state==='paused'?'resume':'pause')}${button('stop','stop')}</div>`:`<div class="od-row">${button('new','new',!!s.draft_ready||!s.ready)}${button('append','append',!state.is_active||!!s.draft_ready||!s.ready)}</div>`}${s.draft_ready?`<div class="od-row">${button('review','generate')}${button('discard','discard')}</div>`:''}<p>${esc(tr('raw'))}</p>`;}
 function renderMerge(s,session,recording,map){return `<h2>${esc(tr('merge'))}</h2><p>${esc(tr('review'))}</p>${button('preview-merge','generate',!s.draft_ready)}${merge?merge.candidates.map((c,i)=>`<div class="od-box"><b>${esc(tr('connection'))} ${i+1}</b><small> ${c.distance_m.toFixed(2)} m</small><div class="od-row"><button data-decision="${esc(c.id)}" data-value="connect" class="${decisions[c.id]==='connect'?'primary':''}">${esc(tr('connect'))}</button><button data-decision="${esc(c.id)}" data-value="separate" class="${decisions[c.id]==='separate'?'primary':''}">${esc(tr('separate'))}</button></div></div>`).join('')+merge.conflicts.map((c,i)=>`<div class="od-box"><b>${esc(tr('overlap'))} ${i+1}</b><p>${esc(tr(merge.network.roads.find(r=>r.id===c.old_road).gait))} → ${esc(tr(merge.network.roads.find(r=>r.id===c.new_road).gait))}</p><small>${esc(c.old_road)} / ${esc(c.new_road)}</small><div class="od-row"><button data-choice="${esc(c.id)}" data-value="old" class="${choices[c.id]==='old'?'primary':''}">${esc(tr('old'))}</button><button data-choice="${esc(c.id)}" data-value="new" class="${choices[c.id]==='new'?'primary':''}">${esc(tr('newGait'))}</button></div></div>`).join('')+button('apply','apply',merge.candidates.some(c=>!decisions[c.id])||merge.conflicts.some(c=>!choices[c.id])):''}${state.draft?.merge_reviewed?`<div class="od-box">${esc(tr('reviewed'))}</div><label>${esc(tr('name'))}<input type="text" id="od-name" value="outdoor-${Date.now().toString(36)}"></label>${button('save','save')}`:''}${saved?`<p>${esc(tr('saved'))}</p>${button('load-saved','load')}`:''}`;}
 function renderPlan(s,session,recording,map){return `<h2>${esc(tr('plan'))}</h2><p>${esc(state.is_active?tr('chooseGoal'):tr('different'))}</p><div class="od-fields">${field('start',start?tr('manual'):tr('current'))}${field('goal',goal?tr('manual'):tr('notSelected'))}${route?field('length',route.length_m.toFixed(1)+' '+tr('meters')):''}</div><div class="od-row">${button('select-start','chooseStart',!state.is_active)}${button('current','usePosition',!state.is_active)}</div>${button('plan','preview',!goal||!state.is_active)}${route&&(route.low_accuracy||route.intervals.some(i=>i.gait==='unknown'))?`<div class="od-box od-warning">${esc(tr('routeWarning'))}</div>`:''}${route?`<div class="od-box">${route.intervals.map(i=>esc(tr(i.gait))+' · '+esc(tr(i.grade))).filter((v,i,a)=>i===0||v!==a[i-1]).join('<br>')}</div>`:''}<p>${esc(tr('navigation'))}</p>`;}
 function render(){if(!state)return;const s=state.status,session=s.session||{},recording=['recording','paused'].includes(session.state),map=snapshot();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.disabled=recording&&b.dataset.mode!=='capture'});
  panel.innerHTML=({view:renderView,capture:renderCapture,merge:renderMerge,plan:renderPlan})[mode](s,session,recording,map);
  draw();
 }
 async function refresh(){try{const next=await request('/api/outdoor/state'),previous=state;state=next;if(previous?.map?.version!==next.map?.version||previous?.map?.map_id!==next.map?.map_id){goal=start=route=null;fitted=false}$('#od-status').textContent=(state.status.example_data||state.map?.example_data?tr('example')+' · ':'')+tr('map')+': '+(snapshot()?.map_id||'—')+' · '+tr('session')+': '+tr(state.status.session?.state||'idle')+' · '+tr('points')+': '+(state.status.point_count||0);if(!previous||previous.is_active!==next.is_active||previous.map?.version!==next.map?.version||previous.map?.map_id!==next.map?.map_id||previous.status.receiver_quality!==next.status.receiver_quality||previous.status.gait_code!==next.status.gait_code||previous.status.position_valid!==next.status.position_valid||previous.status.ready!==next.status.ready||previous.status.session?.state!==next.status.session?.state||previous.status.draft_ready!==next.status.draft_ready)render();else draw();if(!fitted)fit();return next}catch(e){if(state){state.status.pose=null;state.is_active=false;render()}error(e.message)}}
 async function act(command){if(busy)return;busy=true;error('');try{
  if(['new','append'].includes(command)){if(command==='new'&&snapshot()&&!confirm(tr('confirmNew')))return;await request('/api/outdoor/capture',{action:'start',new_map:command==='new'});mode='capture';merge=null;}
  else if(['pause','resume','stop'].includes(command)){await request('/api/outdoor/capture',{action:command});if(command==='stop')mode='merge'}
  else if(command==='discard'){if(!confirm(tr('confirmDiscard')))return;await request('/api/outdoor/capture',{action:'discard'});merge=null}
  else if(command==='preview-merge'||command==='review'){merge=await request('/api/outdoor/preview_merge',{});decisions={};choices={};mode='merge'}
  else if(command==='apply'){await request('/api/outdoor/apply_merge',{preview_id:merge.preview_id,decisions,choices});merge=null}
  else if(command==='save'){saved=$('#od-name').value.trim();await request('/api/maps/save',{map_id:saved,map_type:'outdoor'})}
  else if(command==='load-saved'){await request('/api/maps/load',{map_id:saved,map_type:'outdoor'});mode='view';saved=null}
  else if(command==='plan'){const m=snapshot();route=await request('/api/outdoor/plan_route',{map_id:m.map_id,version:m.version,goal,...(start?{start}:{})})}
  else if(command==='select-start'){selectStart=true;return}
  else if(command==='current'){start=null;selectStart=false}
  else if(command==='mark-region'||command==='mark-poi'){drawKind=command==='mark-region'?'region':'poi';vertices=[]}
  else if(command==='cancel-draw'){drawKind=null;vertices=[]}
  else if(command==='fit'){fit();return}
  else if(command.startsWith('zoom-')){zoom(command==='zoom-in'?.8:1.25);return}
  await refresh();render();
 }catch(e){error(e.message)}finally{busy=false}}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;drawKind=null;vertices=[];render()}else if(b.dataset.command)act(b.dataset.command);else if(b.dataset.decision){decisions[b.dataset.decision]=b.dataset.value;render()}else if(b.dataset.choice){choices[b.dataset.choice]=b.dataset.value;render()}});
 root.addEventListener('change',e=>{if(e.target.id==='od-gait')showGait=e.target.checked;if(e.target.id==='od-quality-toggle')showQuality=e.target.checked;draw()});
 const world=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:q.x,y:-q.y}};
 function projected(p,r){let best=null;for(let i=1;i<r.points.length;i++){const a=r.points[i-1],b=r.points[i],dx=b.x-a.x,dy=b.y-a.y,n=dx*dx+dy*dy,t=n?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/n)):0,q={x:a.x+t*dx,y:a.y+t*dy},d=Math.hypot(q.x-p.x,q.y-p.y);if(!best||d<best.d)best={...q,d}}return{x:best.x,y:best.y}}
 let drag=null,moved=false;
 svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,view:[...view]};moved=false});window.addEventListener('pointermove',e=>{if(!drag||drawKind)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)moved=true;if(moved){const k=drag.view[2]/svg.clientWidth;view=[drag.view[0]-dx*k,drag.view[1]-dy*k,...drag.view.slice(2)];draw()}});window.addEventListener('pointerup',()=>drag=null);
 svg.addEventListener('click',e=>{if(moved)return;const p=world(e);if(drawKind){vertices.push(p);draw();if(drawKind==='poi')finishDrawing();return}if(e.target.dataset.join){decisions[e.target.dataset.join]='connect';render();return}if(e.target.dataset.road===undefined)return;const r=roads()[Number(e.target.dataset.road)];if(mode==='view'){selected=r.id;render()}else if(mode==='plan'&&state.is_active){const q=projected(p,r);if(selectStart){start=q;selectStart=false}else goal=q;route=null;render()}});
 async function finishDrawing(){if(!drawKind||!state.is_active)return;if(drawKind==='region'&&vertices.length<3)return;const name=prompt(tr('annotationName'));if(!name)return;try{await request('/api/regions',{kind:drawKind,name,points:vertices.map(p=>[p.x,p.y]),map_id:snapshot().map_id,version:snapshot().version});drawKind=null;vertices=[];await refresh();render()}catch(e){error(e.message)}}
 svg.addEventListener('dblclick',e=>{if(drawKind){e.preventDefault();finishDrawing()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawKind=null;vertices=[];render()}if(e.key==='Enter'&&drawKind){e.preventDefault();finishDrawing()}});
 function zoom(f){const cx=view[0]+view[2]/2,cy=view[1]+view[3]/2,w=Math.max(2,Math.min(50000,view[2]*f)),h=w*view[3]/view[2];view=[cx-w/2,cy-h/2,w,h];draw()}svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.1:1/1.1)},{passive:false});
 async function poll(){await refresh();setTimeout(poll,1000)}poll();
});
</script>
