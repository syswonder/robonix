<!doctype html>
<meta charset="utf-8" />
<title>scene — rerun</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  /* Sized by percentage, not by `position: absolute; inset: 0`.
     The viewer writes `position: relative` onto this element as it starts,
     which overrides the stylesheet and leaves `inset` doing nothing -- the
     host then took its height from its content, the content being a canvas
     eframe had sized to its 640x360 default precisely because the host had
     no height to measure. The map drew into a 640x360 corner of a 969x902
     frame and nothing reported an error. A percentage height survives the
     viewer's own `position`, so the container is definite before it is
     measured. */
  #host { width: 100%; height: 100%; }
  /* `!important` because the viewer writes `width: 640px; height: 360px`
     straight onto the canvas as an inline style, and inline beats a
     stylesheet. That default is where the map was drawing: a 640x360 picture
     in the corner of a 969x902 frame, correct in every respect except size,
     which is why it read as a rendering bug rather than a layout one.
     `display: block` as well -- a canvas is inline by default and picks up a
     baseline gap under it.
     Only the canvas is touched. Pinning the viewer's other children was tried
     once and stacked its layout into drawing nothing at all. */
  #host > canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }
  .msg { color: #9aa4b2; font: 14px/1.6 system-ui, sans-serif; padding: 24px; }
  .msg a { color: #7aa2f7; }
</style>
<div id="host"></div>
<script type="module">
  // The viewer is embedded as a module rather than loaded as a bare iframe,
  // because the iframe form reports nothing to its host. As a module it hands
  // back a `selection_change` event carrying the entity path, which is what
  // lets a click in the 3D view select the same object in the panel.
  import { WebViewer } from "/assets/rerun/index.js";

  const host = document.getElementById("host");
  const which = new URLSearchParams(location.search).get("view") || "3d";

  function down(text, fallback) {
    host.innerHTML =
      '<div class="msg">No viewer: ' + text +
      '.<br><br>The built-in view is at <a href="' + fallback + '">' +
      fallback + "</a>.</div>";
  }

  try {
    const info = await (await fetch("/api/viewer")).json();
    // `url` and `url_2d` are the viewer pages the sink used to hand out; what
    // this page needs is the data endpoint they were pointing at.
    const raw = which === "2d" ? info.url_2d : info.url;
    if (!raw) throw new Error(info.detail || "the viewer is not running");
    const data = decodeURIComponent(new URL(raw, location.origin)
      .searchParams.get("url") || "");
    if (!data) throw new Error("no data endpoint in /api/viewer");

    const viewer = new WebViewer();
    await viewer.start(data, host, { hide_welcome_screen: true });

    // Up to the shell: this page is embedded, so the selection has to cross
    // one frame boundary to reach the object panel.
    // eframe sizes its canvas from the element it was given, once, and an
    // element in a frame that is still laying out measures small -- which is
    // why the map drew into a corner. It re-reads the size on `resize`, so a
    // nudge after layout and on every later change is the whole fix. Not CSS:
    // stretching the canvas would scale a small render rather than draw a
    // large one, and an earlier attempt to pin the viewer's own children
    // stacked its layout and drew nothing at all.
    const renudge = () => window.dispatchEvent(new Event("resize"));
    requestAnimationFrame(renudge);
    setTimeout(renudge, 300);
    setTimeout(renudge, 1200);
    new ResizeObserver(renudge).observe(host);

    viewer.on("selection_change", (event) => {
      const entity = (event.items || []).find((i) => i.type === "entity");
      parent.postMessage(
        { source: "scene-rerun", type: "selection",
          entity_path: entity ? entity.entity_path : null,
          position: entity ? entity.position : null },
        location.origin,
      );
    });

    // Down from the shell: clicking a row in the panel points the camera at
    // that object. rerun has no API to set the selection, but the blueprint
    // decides where the eye looks, and scene can resend one.
    window.addEventListener("message", (ev) => {
      if (ev.origin !== location.origin) return;
      const m = ev.data;
      if (!m || m.source !== "scene-shell" || m.type !== "focus") return;
      fetch("/api/viewer/focus", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ object_id: m.object_id, view: which }),
      }).catch(() => {});
    });
  } catch (error) {
    down(String(error && error.message ? error.message : error),
         which === "2d" ? "/2d" : "/3d");
  }
</script>
