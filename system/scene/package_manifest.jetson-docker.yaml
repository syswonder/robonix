# Scene MCP server — Jetson + DOCKER deployment target.
#
#   build → RBNX_BUILD_TARGET=jetson-docker scripts/build.sh: docker build
#           with docker/Dockerfile.jetson (Jetson PyTorch/Torch-TensorRT wheels
#           in the image; JetPack TensorRT/CUDA libraries come from the host
#           through the NVIDIA container runtime).
#   start → ROBONIX_SCENE_FORCE=docker scripts/start.sh: docker run with the
#           NVIDIA container runtime for GPU passthrough.
#
# Use this on a Jetson when you want containerized ROS/Python dependencies.
# A matching host JetPack installation remains required for CUDA/TensorRT.
manifestVersion: 1

package:
  name: com.robonix.system.scene
  version: 0.1.0
  vendor: robonix
  description: Scene — semantic + geometric live map (Jetson + docker / L4T target).
  license: MulanPSL-2.0

build: RBNX_BUILD_TARGET=jetson-docker bash scripts/build.sh
start: SCENE_PERCEPTION_PROFILE=jetson ROBONIX_SCENE_FORCE=docker bash scripts/start.sh

capabilities:
  - name: robonix/system/scene/list_objects
  - name: robonix/system/scene/get_robot_context
  - name: robonix/system/scene/list_regions
  - name: robonix/system/scene/goal_near
  - name: robonix/system/scene/goal_room
  - name: robonix/system/scene/get_scene_graph
  - name: robonix/system/scene/get_object_context
  - name: robonix/system/scene/list_relations
  - name: robonix/system/scene/update_object_label
  - name: robonix/system/scene/update_object_geometry
  - name: robonix/system/scene/delete_object
  - name: robonix/system/scene/flush_objects
