# Robonix system service: scene — current-state semantic + geometric
# map of the robot's environment, exposed as MCP tools for Pilot.
#
# uv-managed: `uv sync` (called from scripts/build.sh) materialises a
# local rbnx-build/venv/ from this file + uv.lock. No requirements.txt.
#
# Why these deps:
#   numpy / scipy   — vectorised pose math + Hungarian assignment in
#                     state/data_assoc.py.
#   open3d          — plane segmentation in geom/plane_extract.py.
#                     Optional at import time so the rest of scene
#                     still boots when open3d isn't installed (CI).
#   mcp / fastmcp   — MCP tool server (same as system/memory).
#   grpcio*         — atlas client (RegisterCapability + DeclareInterface
#                     + ConnectCapability + heartbeat).
#   httpx / Pillow  — VLM-based detection: RGB → JSON detection list
#                     via the same OpenAI-compatible endpoint pilot uses.
#                     Pillow only needed to decode camera/snapshot's
#                     base64 JPEG before re-encoding for the API.
#   robonix-api      — @mcp_contract decorator (auto-derives JSON schema
#                     from codegen-typed handlers, mirrors memory).
[project]
name = "robonix-system-scene"
version = "0.1.0"
description = "Scene MCP server — semantic + geometric live map of the robot's environment."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11",
    # open3d has no cp313 wheel (as of 0.19); gate on python_version so
    # the venv resolves cleanly on hosts running 3.13. plane_extract
    # already no-ops without it, so missing it is graceful.
    "open3d>=0.18; platform_machine == 'x86_64' and python_version < '3.13'",
    # Pinned: mcp 2.x renamed FastMCP to MCPServer and moved its import
    # path, and every caller still imports mcp.server.fastmcp.
    "mcp>=1.27,<2",
    "fastmcp>=3,<5",
    # Generated stubs from scripts/run_python_codegen.sh require these runtime
    # versions. The protobuf compiler stays in its isolated codegen venv.
    "grpcio==1.80.0",
    "grpcio-tools==1.76.0",
    "protobuf==6.33.6",
    "uvicorn",
    "httpx",
    "Pillow",
    "PyYAML",
    # Object persistence (warm restore). Embedded milvus-lite in a scene-owned
    # objects.db; same DB tech as system/memory but a separate file/process.
    # 2.6.10 excluded (broken upsert); system/memory pulls pymilvus
    # transitively (via memsearch), without an explicit pin.
    "pymilvus!=2.6.10,>=2.5.0",
    "robonix-api",
]

# The 3D viewer, deliberately optional. Scene used to draw its own map with
# three.js pulled from a CDN, which needs WebGL and outbound network: on a
# headless robot that page renders nothing. rerun ships the viewer, its own
# web server and the wire protocol between them, so Scene logs entities and
# links to the viewer instead of maintaining one.
#
# It is an extra rather than a dependency because a port to a new board has
# to be able to bring Scene up without solving for it: rerun-sdk declares
# numpy>=2, which the perception stack cannot take. The x86 docker image
# installs it separately (docker/requirements/scene-viewer.txt) and Scene
# falls back to the built-in pages wherever it is missing.
[project.optional-dependencies]
viewer = ["rerun-sdk>=0.37,<0.38"]

# This package is the service itself; `uv sync` only needs to install
# dependencies into a venv, not build/install scene_service as a wheel.
[tool.uv]
package = false

# Resolved through the workspace at the repo root (see /pyproject.toml).
[tool.uv.sources]
robonix-api = { workspace = true }
