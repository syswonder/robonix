# Scene MCP server — Jetson + NATIVE host-ROS2 deployment target.
#
#   build → detect the supported L4T/Ubuntu/Python combination, prepare a
#           versioned environment, reuse or install GPU/ROS dependencies,
#           and verify native inference before publishing the environment.
#   start → start_native.sh loads that environment and shares host ROS 2 RMW.
#
# The board must already boot a supported JetPack OS image. See README.md
# for the supported profiles and automatic native preparation.
manifestVersion: 1

package:
  name: com.robonix.system.scene
  version: 0.1.0
  vendor: robonix
  description: Scene — semantic + geometric live map (Jetson + native host-ROS2 target).
  license: MulanPSL-2.0

build: RBNX_BUILD_TARGET=jetson-native bash scripts/build.sh
start: ROBONIX_SCENE_FORCE=native bash scripts/start.sh

capabilities:
  - name: robonix/system/scene/list_objects
    transport: mcp
  - name: robonix/system/scene/get_robot_context
    transport: mcp
  - name: robonix/system/scene/list_regions
    transport: mcp
  - name: robonix/system/scene/goal_near
    transport: mcp
  - name: robonix/system/scene/goal_region
    transport: mcp
  # Deprecated alias of goal_region, kept for older callers.
  - name: robonix/system/scene/goal_room
    transport: mcp
  - name: robonix/system/scene/find
    transport: mcp
  - name: robonix/system/scene/get_scene_graph
    transport: mcp
  - name: robonix/system/scene/get_object_context
    transport: mcp
  - name: robonix/system/scene/list_relations
    transport: mcp
  - name: robonix/system/scene/update_object_label
    transport: mcp
  - name: robonix/system/scene/update_object_geometry
    transport: mcp
  - name: robonix/system/scene/delete_object
    transport: mcp
  - name: robonix/system/scene/flush_objects
    transport: mcp
