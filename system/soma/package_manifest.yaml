# soma — robot body description package.
#
# Single source of truth for "what does this robot look like" — URDF
# string, footprint polygon, sensor extrinsics. Replaces hardcoded
# robot geometry in nav2 / scene viz / collision monitors. nav2_wrapper
# queries `system/soma/footprint` for costmap inflation; scene queries
# `system/soma/sensor_extrinsics` for camera-to-world projection;
# pilot can query `system/soma/description` for "what robot am I".
#
# Config (passed via `RBNX_CONFIG_FILE` from the deploy manifest):
#   urdf_path:        path to a URDF file on disk. REQUIRED.
#   model_name:       optional human-readable name (overrides URDF's <robot name="">)
#   base_frame:       optional kinematic root, default "base_link"
#   footprint_xy_pts: optional override for the 2D footprint polygon
#                     (list of [x, y] in base_link, CCW). When omitted,
#                     soma computes a hull from the URDF's link
#                     collision shapes; override is needed when the
#                     hull is too generous (Tiago torso overhang vs
#                     base footprint).
#
# soma owns the URDF lifecycle: loads from disk, publishes
# `/robot_description` (TRANSIENT_LOCAL, std_msgs/String) so any
# subscriber gets the cached value on connect, and spawns
# `robot_state_publisher` against that topic so `/tf_static` carries
# the rigid-body chain. Consumers (rviz, nav2, scene) talk to those
# standard ROS2 endpoints — soma's MCP queries (`description`,
# `footprint`, `sensor_extrinsics`) are robonix-specific surfaces
# layered on top of the same loaded model.
#
# Without `urdf_path`, soma comes up but answers every query with
# `no_description` — the deploy must explicitly provide one.
manifestVersion: 1

package:
  name: com.robonix.system.soma
  version: 0.1.0
  vendor: robonix
  description: Robot body description (URDF + footprint + sensor extrinsics).
  license: MulanPSL-2.0

build: bash scripts/build.sh

start: |
  export PYTHONPATH="$(pwd)/rbnx-build/codegen/proto_gen:$(pwd)/rbnx-build/codegen/robonix_mcp_types:${PYTHONPATH:-}"
  mkdir -p rbnx-build/data
  exec rbnx-build/venv/bin/python -m soma_service.service \
       > rbnx-build/data/soma.log 2>&1

capabilities:
  - name: robonix/system/soma/description
  - name: robonix/system/soma/footprint
  - name: robonix/system/soma/sensor_extrinsics
