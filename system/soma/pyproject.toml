# soma — robot body description package. uv-managed deps; build phase
# materialises rbnx-build/venv/ from this file + the codegen output.

[project]
name = "robonix-system-soma"
version = "0.1.0"
description = "Robot body description (URDF + footprint + sensor extrinsics)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "mcp",
    "fastmcp",
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "uvicorn",
    "urdf-parser-py",
    "robonix-py",
]

[tool.uv]
package = false

[tool.uv.sources]
robonix-py = { path = "../../pylib/robonix-py", editable = true }
