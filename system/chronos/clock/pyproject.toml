[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "robonix-chronos-clock"
version = "1.1.0b1"
description = "Chronos reference and steady clock readings without system service dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MulanPSL-2.0"

[tool.maturin]
features = ["python"]
module-name = "robonix_chronos_clock"
