[package]
name = "robonix-chronos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Robonix Chronos: clock-domain models and synchronization state"

[lib]
name = "robonix_chronos"
path = "src/lib.rs"

[[bin]]
name = "robonix-chronos"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
robonix-chronos-clock = { workspace = true, features = ["serde"] }
robonix-scribe.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
tempfile = "3"
anyhow.workspace = true
clap.workspace = true
jiff = { version = "0.2", default-features = false, features = ["tz-system", "tzdb-zoneinfo"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
robonix-atlas = { path = "../atlas" }
tower-http = { version = "0.6", features = ["limit"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rmcp = { workspace = true, features = ["transport-streamable-http-client-reqwest"] }

[build-dependencies]
robonix-codegen.workspace = true
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true
