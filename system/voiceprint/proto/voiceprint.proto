//
// Package-private gRPC schema for the Robonix voiceprint service.
//
// The frozen v0.1 capability contract for voiceprint identification lives in
//   rust/crates/robonix-interfaces/lib/voiceprint/srv/Identify.srv
// and is consumed by Liaison's voice gating path. That contract exposes ONLY
// the one-shot Identify RPC and its wire format must not change in v0.1.
//
// This file extends the same Identify RPC with two service-local management
// RPCs (Enroll, ListEnrolled) so the Python service can stand on its own for
// enrollment and inspection without an out-of-band JSON editor. These two
// extra RPCs are NOT part of the Atlas capability surface and Liaison does
// not call them. Treat this schema as an admin-only API contract for tools
// that talk directly to the voiceprint service port (default 50092).

syntax = "proto3";

package robonix.voiceprint;

service VoiceprintService {
  // Speaker identification (one-shot). Mirrors the frozen
  // robonix/system/speech/voiceprint capability so the service can answer
  // Liaison's identification probes from this same listener.
  rpc Identify (IdentifyRequest) returns (IdentifyResponse);

  // Admin: register a new speaker by extracting their embedding.
  rpc Enroll (EnrollRequest) returns (EnrollResponse);

  // Admin: list every currently enrolled user.
  rpc ListEnrolled (ListEnrolledRequest) returns (ListEnrolledResponse);
}

message IdentifyRequest {
  bytes  audio_data     = 1;  // raw PCM bytes (default encoding pcm_s16le)
  string encoding       = 2;  // "pcm_s16le" | "wav"; empty -> pcm_s16le
  uint32 sample_rate_hz = 3;  // sample rate of audio_data; 0 -> 16000
}

message IdentifyResponse {
  string user_id    = 1;  // enrolled id, or "" when nothing matched
  string user_name  = 2;  // human-friendly label, "" if unknown
  float  confidence = 3;  // 0.0 – 1.0 cosine similarity against the best match
  bool   is_known   = 4;  // true iff confidence crossed the service threshold
  string error      = 5;  // non-empty on failure
}

message EnrollRequest {
  string user_id       = 1;
  string user_name     = 2;
  bytes  audio_data    = 3;
  string encoding      = 4;
  uint32 sample_rate_hz = 5;
}

message EnrollResponse {
  bool   success = 1;
  string error   = 2;
}

message ListEnrolledRequest {}

message ListEnrolledResponse {
  repeated EnrolledUser users = 1;
}

message EnrolledUser {
  string user_id   = 1;
  string user_name = 2;
}
