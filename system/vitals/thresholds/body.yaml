# Per-model joint temperature thresholds.
# This file is mandatory — vitals will refuse to start without a valid body.yaml.
#
# Fault code decoding is handled by the Python collector scripts, not here.
# Each body SDK knows its own hardware fault bit definitions; the collector
# writes decoded fault labels into BodyHealth.message.

default:
  temp_warn_c: 60.0
  temp_error_c: 75.0

models:
  piper:
    temp_warn_c: 60.0
    temp_error_c: 75.0

  koch:
    temp_warn_c: 60.0
    temp_error_c: 75.0

  go2:
    temp_warn_c: 60.0
    temp_error_c: 75.0
