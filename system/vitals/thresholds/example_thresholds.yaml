robot_model: "mock_ranger_piper_v1"

rules:
  - id: "joint_motor_temp"
    selector:
      kind: "JOINT"
      signal: "motor_temp"
    warn_above: 60.0
    error_above: 75.0
    unit: "degC"

  - id: "joint_driver_temp"
    selector:
      kind: "JOINT"
      signal: "driver_temp"
    warn_above: 70.0
    error_above: 85.0
    unit: "degC"

  - id: "wheel_driver_temp"
    selector:
      kind: "WHEEL"
      signal: "driver_temp"
    warn_above: 75.0
    error_above: 90.0
    unit: "degC"

  - id: "battery_soc"
    selector:
      kind: "BATTERY"
      signal: "soc_percent"
    warn_below: 20.0
    error_below: 8.0
    unit: "percent"

  - id: "battery_voltage"
    selector:
      kind: "BATTERY"
      signal: "voltage"
    warn_below: 22.0
    error_below: 19.0
    unit: "V"

  - id: "board_temperature"
    selector:
      kind: "SENSOR"
      signal: "temperature"
    warn_above: 80.0
    error_above: 90.0
    unit: "degC"
