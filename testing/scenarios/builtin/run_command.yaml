# Executor builtin run_command.
name: run_command
task: "ci-test: run a shell command that echoes a marker"
steps:
  - status: in_progress
    rtdl_description: echo marker
    caps:
      - cap: executor.builtin_run_command
        args: {command: "echo robonix-ci-marker-bravo"}
  - status: done
expect_leaves:
  - contract: robonix/system/executor/builtin/run_command
    success: true
    args: {command: "echo robonix-ci-marker-bravo"}
    output:
      text_regex: "^robonix-ci-marker-bravo\\n?$"
