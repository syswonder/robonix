# Exception injection on a builtin: read a file that is never created, then
# recover by writing and reading a separate fallback file.
name: fault_recovery_builtin
task: "ci-flow: read a missing file, recovering by using a fallback file"
steps:
  - status: in_progress
    rtdl_description: faulty read
    caps:
      - cap: executor.builtin_read_file
        args: {path: ci_never_created.txt}
  - status: in_progress
    rtdl_description: recover by writing fallback
    caps:
      - cap: executor.builtin_write_file
        args: {path: ci_recovered.txt, content: "recovered charlie-3"}
  - status: in_progress
    rtdl_description: read fallback
    caps:
      - cap: executor.builtin_read_file
        args: {path: ci_recovered.txt}
  - status: done
expect_min_rounds: 2
expect_final_done: true
expect_leaves:
  - contract: robonix/system/executor/builtin/read_file
    success: false
    args: {path: ci_never_created.txt}
    output:
      error_regex: "No such file"
  - contract: robonix/system/executor/builtin/write_file
    success: true
    args: {path: ci_recovered.txt, content: "recovered charlie-3"}
  - contract: robonix/system/executor/builtin/read_file
    success: true
    args: {path: ci_recovered.txt}
    output:
      text_equals: "recovered charlie-3"
