# Exercise the memory service save + search RPCs in one tree.
name: memory_roundtrip
task: "ci-test: remember a fact and then search for it"
steps:
  - content: Saving a fact, then searching for it.
    rtdl_description: memory save + search
    status: in_progress
    caps:
      - cap: memory.memory_save
        args:
          data: "ci-fact: the test beacon is alpha-7"
        description: persist a fact
      - cap: memory.memory_search
        args:
          data: test beacon
        description: recall the fact
  - content: Saved and recalled.
    status: done
expect_leaves:
  - contract: robonix/service/memory/save
    success: true
    args:
      data: "ci-fact: the test beacon is alpha-7"
    output:
      json: {data: "Memory saved and indexed."}
  - contract: robonix/service/memory/search
    success: true
    args:
      data: test beacon
    output:
      text_regex: "ci-fact: the test beacon is alpha-7"
