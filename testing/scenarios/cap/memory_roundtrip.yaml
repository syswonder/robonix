# Exercise the memory service save + search RPCs in one tree (two calls).
name: memory_roundtrip
task: "ci-test: remember a fact and then search for it"
steps:
  - content: Saving a fact, then searching for it.
    rtdl_description: memory save + search
    status: in_progress
    caps:
      # memsearch registers MCP handlers directly as std_msgs/String, so the
      # planner-facing args are the message fields themselves: {data: ...}.
      - match: memory_save
        args:
          data: "ci-fact: the test beacon is alpha-7"
        description: persist a fact
      - match: memory_search
        args:
          data: test beacon
        description: recall the fact
  - content: Saved and recalled.
    status: done
expect_contracts:
  - robonix/service/memory/save
  - robonix/service/memory/search
expect_args:
  - alpha-7
  - test beacon
expect_outputs:
  - Memory saved and indexed
  - 'ci-fact: the test beacon is alpha-7'
