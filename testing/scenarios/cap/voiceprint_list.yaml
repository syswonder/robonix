# Exercise the voiceprint service's read path.
name: voiceprint_list
task: "ci-test: list the enrolled voiceprints"
steps:
  - content: Listing enrolled voiceprints.
    rtdl_description: voiceprint list
    status: in_progress
    rtdl:
      op: sequence
      id: voiceprint_list_step
      children:
        - op: do
          id: voiceprint_list
          cap: voiceprint.voiceprint_list
          args: {}
          description: list enrolled speakers
          expect:
            contract: robonix/service/voiceprint/list
            success: true
            output:
              text_regex: '"users_json"'
              checks:
                - select: $.count
                  assert: {op: exists}
  - content: Listed.
    status: done
