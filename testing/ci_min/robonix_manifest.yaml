# Minimal self-contained deploy for CI harness validation: atlas + executor
# (its builtins are the test surface) + pilot (fake VLM) + liaison. Alt ports
# so it never collides with another deploy on the box. No primitives/services.
name: ci_min
env:
  LOG: "INFO"
system:
  atlas:
    listen: 0.0.0.0:50151
  executor:
    listen: 127.0.0.1:50161
  pilot:
    listen: 127.0.0.1:50171
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50181
